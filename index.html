<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>مدرسة الجيل الجديد • نظام المتابعة</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- شريط التدرج العلوي -->
            <div class="card-accent-bar"></div>
            
            <div class="card-body">
                <!-- الهيدر -->
                <div class="auth-header">
                    <div class="auth-brand">
                        <div class="auth-brand-icon">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <div class="auth-brand-text">
                            <h3>الجيل الجديد</h3>
                            <span>نظام المتابعة الذكي</span>
                        </div>
                    </div>
                    <div class="badge badge-premium">
                        <i class="fas fa-star"></i> مفعّل
                    </div>
                </div>
                
                <!-- العنوان -->
                <div>
                    <h2 class="auth-title">مرحبًا بكم</h2>
                    <p class="auth-subtitle">اختر نوع المستخدم للوصول إلى لوحة التحكم الخاصة بك</p>
                </div>
                
                <!-- بطاقات الأدوار -->
                <div class="role-cards">
                    <div class="role-card admin-card" onclick="navigateToRole('admin')">
                        <i class="fas fa-user-shield"></i>
                        <span>الإدارة</span>
                    </div>
                    <div class="role-card" onclick="navigateToRole('teacher')">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <span>المعلمون</span>
                    </div>
                    <div class="role-card student-card" onclick="navigateToRole('student')">
                        <i class="fas fa-user-graduate"></i>
                        <span>الطلاب</span>
                    </div>
                </div>
                
                <!-- التذييل -->
                <div class="auth-footer">
                    <span>الإصدار 2.0</span>
                    <span>إنشاء وبرمجة أ/ اسماعيل عماد</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        /**
         * التوجيه إلى صفحة تسجيل الدخول حسب الدور
         */
        function navigateToRole(role) {
            switch (role) {
                case 'admin':
                    window.location.href = 'admin/login.html';
                    break;
                case 'teacher':
                    window.location.href = 'teacher/login.html';
                    break;
                case 'student':
                    window.location.href = 'student/login.html';
                    break;
                default:
                    window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
