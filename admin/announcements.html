<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعلانات | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الإعلانات...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth, getCurrentUserProfile } from '../js/auth.js';
        import { 
            getAllDocuments, 
            createDocument, 
            updateDocument, 
            deleteDocument,
            getDocuments
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { 
            formatDate, 
            formatDateTime,
            showToast, 
            escapeHtml, 
            confirmAction,
            validateRequired,
            getTodayDate
        } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'announcements';
        
        let allAnnouncements = [];
        let allStages = [];
        let allClasses = [];
        let currentProfile = null;
        
        // تهيئة الصفحة
        async function initAnnouncements() {
            try {
                currentProfile = await requireAuth(['admin', 'super_admin']);
                if (!currentProfile) return;
                
                if (!isAdmin(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing announcements:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                const [announcements, stages, classes] = await Promise.all([
                    getDocuments('announcements', [], { orderBy: 'createdAt', orderDirection: 'desc' }),
                    getAllDocuments('stages'),
                    getAllDocuments('classes')
                ]);
                
                allAnnouncements = announcements;
                allStages = stages;
                allClasses = classes;
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الإعلانات');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الإعلانات والأخبار</h1>
                                <p class="page-subtitle">إجمالي الإعلانات: ${allAnnouncements.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddAnnouncementModal()">
                                    + إعلان جديد
                                </button>
                            </div>
                        </div>
                        
                        <!-- Timeline View -->
                        <div class="timeline" id="announcementsTimeline">
                            ${renderAnnouncementsTimeline(allAnnouncements)}
                        </div>
                    </main>
                </div>
                
                <!-- Add/Edit Announcement Modal -->
                <div class="modal-overlay" id="announcementModal" style="display: none;">
                    <div class="modal" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">إعلان جديد</h3>
                            <button class="modal-close" onclick="closeAnnouncementModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="announcementForm">
                                <input type="hidden" id="announcementId">
                                
                                <div class="form-group">
                                    <label class="form-label required">عنوان الإعلان</label>
                                    <input type="text" class="form-control" id="announcementTitle" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label required">محتوى الإعلان</label>
                                    <textarea class="form-control" id="announcementContent" rows="5" required></textarea>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label required">الفئة المستهدفة</label>
                                    <select class="form-control" id="targetType" onchange="toggleTargetFields()">
                                        <option value="all">الجميع (المدرسة كلها)</option>
                                        <option value="students">الطلاب فقط</option>
                                        <option value="teachers">المدرسون فقط</option>
                                        <option value="admins">الإدارة فقط</option>
                                        <option value="stage">مرحلة معينة</option>
                                        <option value="class">فصل معين</option>
                                    </select>
                                </div>
                                
                                <div class="form-row" id="targetFields" style="display: none;">
                                    <div class="form-group" id="stageField" style="display: none;">
                                        <label class="form-label">المرحلة</label>
                                        <select class="form-control" id="targetStage">
                                            <option value="">اختر المرحلة</option>
                                            ${allStages.map(stage => `
                                                <option value="${stage.id}">${escapeHtml(stage.name)}</option>
                                            `).join('')}
                                        </select>
                                    </div>
                                    <div class="form-group" id="classField" style="display: none;">
                                        <label class="form-label">الفصل</label>
                                        <select class="form-control" id="targetClass">
                                            <option value="">اختر الفصل</option>
                                            ${allClasses.map(cls => `
                                                <option value="${cls.id}">${escapeHtml(cls.name)}</option>
                                            `).join('')}
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الحالة</label>
                                    <select class="form-control" id="announcementStatus">
                                        <option value="published">منشور</option>
                                        <option value="draft">مسودة</option>
                                        <option value="archived">مؤرشف</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeAnnouncementModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveAnnouncement()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض الإعلانات في Timeline
        function renderAnnouncementsTimeline(announcements) {
            if (announcements.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📢</div>
                        <div class="empty-state-title">لا توجد إعلانات</div>
                        <div class="empty-state-text">لم يتم نشر أي إعلان بعد</div>
                        <button class="btn btn-primary mt-2" onclick="openAddAnnouncementModal()">
                            + إضافة أول إعلان
                        </button>
                    </div>
                `;
            }
            
            return announcements.map(announcement => {
                const targetLabel = getTargetLabel(announcement.targetType, announcement.targetStageId, announcement.targetClassId);
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="announcement-card">
                            <div class="announcement-header">
                                <h3 class="announcement-title">${escapeHtml(announcement.title)}</h3>
                                <div class="d-flex items-center gap-1">
                                    ${renderStatusBadge(announcement.status)}
                                </div>
                            </div>
                            
                            <p class="announcement-content">${escapeHtml(announcement.content)}</p>
                            
                            <div class="d-flex justify-between items-center flex-wrap gap-2">
                                <div class="d-flex items-center gap-2">
                                    <span class="badge badge-royal">${escapeHtml(targetLabel)}</span>
                                    <span class="text-muted" style="font-size: 0.85rem;">
                                        ${formatDateTime(announcement.createdAt)}
                                    </span>
                                </div>
                                <div class="d-flex gap-1">
                                    <button class="btn btn-sm btn-outline" onclick="editAnnouncement('${announcement.id}')">تعديل</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteAnnouncement('${announcement.id}')">حذف</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // الحصول على تسمية الفئة المستهدفة
        function getTargetLabel(targetType, targetStageId, targetClassId) {
            switch (targetType) {
                case 'all':
                    return 'الجميع';
                case 'students':
                    return 'الطلاب';
                case 'teachers':
                    return 'المدرسون';
                case 'admins':
                    return 'الإدارة';
                case 'stage': {
                    const stage = allStages.find(s => s.id === targetStageId);
                    return `مرحلة: ${stage?.name || '—'}`;
                }
                case 'class': {
                    const cls = allClasses.find(c => c.id === targetClassId);
                    return `فصل: ${cls?.name || '—'}`;
                }
                default:
                    return '';
            }
        }
        
        // تبديل حقول الاستهداف
        window.toggleTargetFields = function() {
            const targetType = document.getElementById('targetType').value;
            const targetFields = document.getElementById('targetFields');
            const stageField = document.getElementById('stageField');
            const classField = document.getElementById('classField');
            
            if (targetType === 'stage') {
                targetFields.style.display = 'flex';
                stageField.style.display = 'block';
                classField.style.display = 'none';
            } else if (targetType === 'class') {
                targetFields.style.display = 'flex';
                stageField.style.display = 'none';
                classField.style.display = 'block';
            } else {
                targetFields.style.display = 'none';
                stageField.style.display = 'none';
                classField.style.display = 'none';
            }
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // فتح modal
        window.openAddAnnouncementModal = function() {
            document.getElementById('modalTitle').textContent = 'إعلان جديد';
            document.getElementById('announcementForm').reset();
            document.getElementById('announcementId').value = '';
            document.getElementById('announcementStatus').value = 'published';
            document.getElementById('targetFields').style.display = 'none';
            document.getElementById('stageField').style.display = 'none';
            document.getElementById('classField').style.display = 'none';
            document.getElementById('announcementModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeAnnouncementModal = function() {
            document.getElementById('announcementModal').style.display = 'none';
            document.body.style.overflow = '';
        };
        
        // تعديل إعلان
        window.editAnnouncement = function(announcementId) {
            const announcement = allAnnouncements.find(a => a.id === announcementId);
            if (!announcement) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل إعلان';
            document.getElementById('announcementId').value = announcementId;
            document.getElementById('announcementTitle').value = announcement.title || '';
            document.getElementById('announcementContent').value = announcement.content || '';
            document.getElementById('targetType').value = announcement.targetType || 'all';
            document.getElementById('announcementStatus').value = announcement.status || 'published';
            
            if (announcement.targetType === 'stage') {
                document.getElementById('targetStage').value = announcement.targetStageId || '';
            }
            if (announcement.targetType === 'class') {
                document.getElementById('targetClass').value = announcement.targetClassId || '';
            }
            
            toggleTargetFields();
            
            document.getElementById('announcementModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        // حفظ إعلان
        window.saveAnnouncement = async function() {
            const announcementId = document.getElementById('announcementId').value;
            const title = document.getElementById('announcementTitle').value.trim();
            const content = document.getElementById('announcementContent').value.trim();
            const targetType = document.getElementById('targetType').value;
            const status = document.getElementById('announcementStatus').value;
            
            let targetStageId = null;
            let targetClassId = null;
            
            if (targetType === 'stage') {
                targetStageId = document.getElementById('targetStage').value || null;
            }
            if (targetType === 'class') {
                targetClassId = document.getElementById('targetClass').value || null;
            }
            
            if (!validateRequired(title)) {
                showToast('الرجاء إدخال عنوان الإعلان', 'warning');
                return;
            }
            
            if (!validateRequired(content)) {
                showToast('الرجاء إدخال محتوى الإعلان', 'warning');
                return;
            }
            
            const announcementData = {
                title,
                content,
                targetType,
                targetStageId,
                targetClassId,
                status,
                createdBy: currentProfile.uid
            };
            
            try {
                if (announcementId) {
                    await updateDocument('announcements', announcementId, announcementData);
                    showToast('تم تحديث الإعلان بنجاح', 'success');
                } else {
                    await createDocument('announcements', announcementData);
                    showToast('تم نشر الإعلان بنجاح', 'success');
                }
                
                closeAnnouncementModal();
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error saving announcement:', error);
                showToast('حدث خطأ أثناء حفظ الإعلان', 'error');
            }
        };
        
        // حذف إعلان
        window.deleteAnnouncement = async function(announcementId) {
            const announcement = allAnnouncements.find(a => a.id === announcementId);
            if (!announcement) return;
            
            const confirmed = await confirmAction(
                `هل أنت متأكد من حذف الإعلان "${announcement.title}"؟`,
                'تأكيد الحذف'
            );
            
            if (!confirmed) return;
            
            try {
                await deleteDocument('announcements', announcementId);
                showToast('تم حذف الإعلان بنجاح', 'success');
                await loadData();
                buildPage(currentProfile);
            } catch (error) {
                console.error('Error deleting announcement:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        // بدء التحميل
        initAnnouncements();
    </script>
</body>
</html>
