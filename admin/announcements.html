<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>الإعلانات | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>
    
    <script type="module">
        import { requireAuth } from '../js/auth.js';
        import { getAllDocuments, getDocuments, createDocument, updateDocument, deleteDocument } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout, toggleSidebar } from '../js/components.js';
        import { showToast, escapeHtml, confirmAction, validateRequired, formatDate } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'announcements';
        
        let allAnnouncements = [];
        let allStages = [];
        let allClasses = [];
        let currentUser = null;
        
        async function initAnnouncements() {
            try {
                currentUser = await requireAuth(['admin', 'super_admin']);
                if (!currentUser) return;
                
                if (!isAdmin(currentUser)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                const [announcements, stages, classes] = await Promise.all([
                    getDocuments('announcements', [], { orderBy: 'createdAt', orderDirection: 'desc' }),
                    getAllDocuments('stages'),
                    getAllDocuments('classes')
                ]);
                
                allAnnouncements = announcements;
                allStages = stages;
                allClasses = classes;
                
                buildPage();
                
            } catch (error) {
                console.error('Error:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function buildPage() {
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${renderSidebar(currentUser, currentPage)}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${renderHeader(currentUser)}
                    </header>
                    <main class="main-content-inner">
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الإعلانات</h1>
                                <p class="page-subtitle">إجمالي الإعلانات: ${allAnnouncements.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddModal()">
                                    <i class="fas fa-plus"></i>
                                    إعلان جديد
                                </button>
                            </div>
                        </div>
                        
                        <!-- عرض الإعلانات -->
                        <div id="announcementsList">
                            ${renderAnnouncements()}
                        </div>
                    </main>
                </div>
                
                <!-- Modal إضافة/تعديل -->
                <div class="modal-overlay" id="announcementModal" style="display: none;">
                    <div class="modal" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">إعلان جديد</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="announcementId">
                            
                            <div class="form-group">
                                <label class="form-label">عنوان الإعلان <span class="required">*</span></label>
                                <input type="text" class="form-control" id="announcementTitle" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">محتوى الإعلان <span class="required">*</span></label>
                                <textarea class="form-control" id="announcementContent" rows="5" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الفئة المستهدفة</label>
                                <select class="form-control" id="targetType" onchange="toggleTargetFields()">
                                    <option value="all">الجميع (المدرسة كلها)</option>
                                    <option value="students">الطلاب فقط</option>
                                    <option value="teachers">المعلمون فقط</option>
                                    <option value="stage">مرحلة معينة</option>
                                    <option value="class">فصل معين</option>
                                </select>
                            </div>
                            
                            <div id="stageField" style="display: none;" class="form-group">
                                <label class="form-label">المرحلة</label>
                                <select class="form-control" id="targetStage">
                                    <option value="">اختر المرحلة</option>
                                    ${allStages.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
                                </select>
                            </div>
                            
                            <div id="classField" style="display: none;" class="form-group">
                                <label class="form-label">الفصل</label>
                                <select class="form-control" id="targetClass">
                                    <option value="">اختر الفصل</option>
                                    ${allClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الحالة</label>
                                <select class="form-control" id="announcementStatus">
                                    <option value="published">منشور</option>
                                    <option value="draft">مسودة</option>
                                    <option value="archived">مؤرشف</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveAnnouncement()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEvents();
        }
        
        function renderAnnouncements() {
            if (allAnnouncements.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-bell"></i></div>
                        <div class="empty-state-title">لا توجد إعلانات</div>
                        <div class="empty-state-text">لم يتم نشر أي إعلان بعد</div>
                    </div>
                `;
            }
            
            return `
                <div class="timeline">
                    ${allAnnouncements.map(announcement => {
                        const targetLabel = getTargetLabel(announcement);
                        
                        return `
                            <div class="timeline-item">
                                <div class="timeline-dot"></div>
                                <div class="announcement-card">
                                    <div class="announcement-header">
                                        <h3 class="announcement-title">${escapeHtml(announcement.title)}</h3>
                                        ${renderStatusBadge(announcement.status || 'published')}
                                    </div>
                                    
                                    <p class="announcement-content">${escapeHtml(announcement.content)}</p>
                                    
                                    <div class="d-flex justify-between items-center flex-wrap gap-2">
                                        <div class="d-flex items-center gap-2">
                                            <span class="badge badge-royal">${escapeHtml(targetLabel)}</span>
                                            <span class="announcement-date">${formatDate(announcement.createdAt)}</span>
                                        </div>
                                        <div class="d-flex gap-1">
                                            <button class="btn btn-sm btn-outline" onclick="editAnnouncement('${announcement.id}')">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteAnnouncement('${announcement.id}')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        function getTargetLabel(announcement) {
            switch (announcement.targetType) {
                case 'all': return 'الجميع';
                case 'students': return 'الطلاب';
                case 'teachers': return 'المعلمون';
                case 'stage': {
                    const stage = allStages.find(s => s.id === announcement.targetStageId);
                    return `مرحلة: ${stage?.name || '—'}`;
                }
                case 'class': {
                    const cls = allClasses.find(c => c.id === announcement.targetClassId);
                    return `فصل: ${cls?.name || '—'}`;
                }
                default: return '';
            }
        }
        
        function setupEvents() {
            document.getElementById('sidebarToggle')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);
            document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
        }
        
        window.toggleTargetFields = function() {
            const targetType = document.getElementById('targetType').value;
            const stageField = document.getElementById('stageField');
            const classField = document.getElementById('classField');
            
            stageField.style.display = 'none';
            classField.style.display = 'none';
            
            if (targetType === 'stage') {
                stageField.style.display = 'block';
            } else if (targetType === 'class') {
                classField.style.display = 'block';
            }
        };
        
        window.openAddModal = function() {
            document.getElementById('modalTitle').textContent = 'إعلان جديد';
            document.getElementById('announcementId').value = '';
            document.getElementById('announcementTitle').value = '';
            document.getElementById('announcementContent').value = '';
            document.getElementById('targetType').value = 'all';
            document.getElementById('announcementStatus').value = 'published';
            document.getElementById('stageField').style.display = 'none';
            document.getElementById('classField').style.display = 'none';
            document.getElementById('announcementModal').style.display = 'flex';
        };
        
        window.closeModal = function() {
            document.getElementById('announcementModal').style.display = 'none';
        };
        
        window.editAnnouncement = function(announcementId) {
            const announcement = allAnnouncements.find(a => a.id === announcementId);
            if (!announcement) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل إعلان';
            document.getElementById('announcementId').value = announcementId;
            document.getElementById('announcementTitle').value = announcement.title || '';
            document.getElementById('announcementContent').value = announcement.content || '';
            document.getElementById('targetType').value = announcement.targetType || 'all';
            document.getElementById('announcementStatus').value = announcement.status || 'published';
            
            if (announcement.targetType === 'stage') {
                document.getElementById('targetStage').value = announcement.targetStageId || '';
            }
            if (announcement.targetType === 'class') {
                document.getElementById('targetClass').value = announcement.targetClassId || '';
            }
            
            toggleTargetFields();
            document.getElementById('announcementModal').style.display = 'flex';
        };
        
        window.saveAnnouncement = async function() {
            const announcementId = document.getElementById('announcementId').value;
            const title = document.getElementById('announcementTitle').value.trim();
            const content = document.getElementById('announcementContent').value.trim();
            const targetType = document.getElementById('targetType').value;
            const status = document.getElementById('announcementStatus').value;
            
            let targetStageId = null;
            let targetClassId = null;
            
            if (targetType === 'stage') {
                targetStageId = document.getElementById('targetStage').value || null;
            }
            if (targetType === 'class') {
                targetClassId = document.getElementById('targetClass').value || null;
            }
            
            if (!validateRequired(title)) {
                showToast('الرجاء إدخال عنوان الإعلان', 'warning');
                return;
            }
            
            if (!validateRequired(content)) {
                showToast('الرجاء إدخال محتوى الإعلان', 'warning');
                return;
            }
            
            const announcementData = {
                title,
                content,
                targetType,
                targetStageId,
                targetClassId,
                status,
                createdBy: currentUser.code
            };
            
            try {
                if (announcementId) {
                    await updateDocument('announcements', announcementId, announcementData);
                    showToast('تم تحديث الإعلان بنجاح', 'success');
                } else {
                    await createDocument('announcements', announcementData);
                    showToast('تم نشر الإعلان بنجاح', 'success');
                }
                
                closeModal();
                location.reload();
                
            } catch (error) {
                console.error('Error saving announcement:', error);
                showToast('حدث خطأ أثناء الحفظ', 'error');
            }
        };
        
        window.deleteAnnouncement = async function(announcementId) {
            const announcement = allAnnouncements.find(a => a.id === announcementId);
            if (!announcement) return;
            
            const confirmed = await confirmAction(`هل أنت متأكد من حذف الإعلان "${announcement.title}"؟`, 'تأكيد الحذف');
            if (!confirmed) return;
            
            try {
                await deleteDocument('announcements', announcementId);
                showToast('تم حذف الإعلان بنجاح', 'success');
                location.reload();
            } catch (error) {
                console.error('Error deleting announcement:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        initAnnouncements();
    </script>
</body>
</html>
