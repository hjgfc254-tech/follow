<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <!-- Loading -->
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل لوحة التحكم...</div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth, getCurrentUserProfile } from '../js/auth.js';
        import { getDocuments, getAllDocuments, getTodayDocuments, countDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatCard, handleLogout } from '../js/components.js';
        import { formatDate, formatCurrency, showToast, escapeHtml } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        // DOM Elements
        const app = document.getElementById('app');
        const loadingContainer = document.getElementById('loadingContainer');
        
        // الصفحة الحالية
        const currentPage = 'dashboard';
        
        // تهيئة الصفحة
        async function initDashboard() {
            try {
                // التحقق من المصادقة
                const profile = await requireAuth(['admin', 'super_admin']);
                
                if (!profile) return;
                
                // التحقق من الصلاحية
                if (!isAdmin(profile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                // تحميل الإحصائيات
                const stats = await loadStatistics();
                
                // تحميل آخر البيانات
                const recentData = await loadRecentData();
                
                // بناء الصفحة
                buildDashboard(profile, stats, recentData);
                
            } catch (error) {
                console.error('Error initializing dashboard:', error);
                showToast('حدث خطأ أثناء تحميل لوحة التحكم', 'error');
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل الإحصائيات
        async function loadStatistics() {
            try {
                // تحميل جميع البيانات المطلوبة بالتوازي
                const [
                    students,
                    teachers,
                    classes,
                    stages,
                    todayAttendance,
                    expenses,
                    announcements
                ] = await Promise.all([
                    getAllDocuments('students'),
                    getAllDocuments('teachers'),
                    getAllDocuments('classes'),
                    getAllDocuments('stages'),
                    getDocumentsByDate('attendance', 'date', getTodayDate()),
                    getAllDocuments('expenses'),
                    getDocuments('announcements', [
                        { field: 'status', operator: '==', value: 'published' }
                    ], { limit: 5 })
                ]);
                
                // حساب الإحصائيات
                const activeStudents = students.filter(s => s.status === 'active').length;
                const activeTeachers = teachers.filter(t => t.status === 'active').length;
                const activeClasses = classes.filter(c => c.status === 'active').length;
                const activeStages = stages.filter(s => s.status === 'active').length;
                
                const presentCount = todayAttendance.filter(a => a.status === 'present').length;
                const absentCount = todayAttendance.filter(a => a.status === 'absent').length;
                const lateCount = todayAttendance.filter(a => a.status === 'late').length;
                
                const totalExpenses = expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                const paidExpenses = expenses.reduce((sum, e) => sum + (Number(e.paidAmount) || 0), 0);
                const remainingExpenses = totalExpenses - paidExpenses;
                
                return {
                    students: activeStudents,
                    teachers: activeTeachers,
                    classes: activeClasses,
                    stages: activeStages,
                    present: presentCount,
                    absent: absentCount,
                    late: lateCount,
                    totalExpenses,
                    paidExpenses,
                    remainingExpenses,
                    announcements
                };
            } catch (error) {
                console.error('Error loading statistics:', error);
                return {
                    students: 0,
                    teachers: 0,
                    classes: 0,
                    stages: 0,
                    present: 0,
                    absent: 0,
                    late: 0,
                    totalExpenses: 0,
                    paidExpenses: 0,
                    remainingExpenses: 0,
                    announcements: []
                };
            }
        }
        
        // تحميل آخر البيانات
        async function loadRecentData() {
            try {
                const [recentStudents, recentLogs] = await Promise.all([
                    getDocuments('students', [], { 
                        orderBy: 'createdAt', 
                        orderDirection: 'desc',
                        limit: 5 
                    }),
                    getDocuments('system_logs', [], { 
                        orderBy: 'createdAt', 
                        orderDirection: 'desc',
                        limit: 5 
                    })
                ]);
                
                return {
                    recentStudents,
                    recentLogs
                };
            } catch (error) {
                console.error('Error loading recent data:', error);
                return {
                    recentStudents: [],
                    recentLogs: []
                };
            }
        }
        
        // بناء الصفحة
        function buildDashboard(profile, stats, recentData) {
            // بناء Sidebar و Header
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'لوحة التحكم');
            
            // بناء بطاقات الإحصائيات
            const statsCards = [
                renderStatCard({ label: 'إجمالي الطلاب', value: stats.students, icon: '👨‍🎓', color: 'blue' }),
                renderStatCard({ label: 'إجمالي المدرسين', value: stats.teachers, icon: '👨‍🏫', color: 'green' }),
                renderStatCard({ label: 'إجمالي الفصول', value: stats.classes, icon: '🏫', color: 'purple' }),
                renderStatCard({ label: 'المراحل الدراسية', value: stats.stages, icon: '📚', color: 'orange' })
            ];
            
            const attendanceCards = [
                renderStatCard({ label: 'الحضور اليوم', value: stats.present, icon: '✅', color: 'green' }),
                renderStatCard({ label: 'الغياب اليوم', value: stats.absent, icon: '❌', color: 'red' }),
                renderStatCard({ label: 'المتأخرون', value: stats.late, icon: '⏰', color: 'yellow' }),
                renderStatCard({ label: 'المصروفات المتبقية', value: formatCurrency(stats.remainingExpenses), icon: '💰', color: 'blue' })
            ];
            
            // بناء Quick Actions
            const quickActions = [
                { href: 'students.html', icon: '👨‍🎓', text: 'إضافة طالب' },
                { href: 'teachers.html', icon: '👨‍🏫', text: 'إضافة مدرس' },
                { href: 'stages.html', icon: '📚', text: 'إضافة مرحلة' },
                { href: 'attendance.html', icon: '✓', text: 'تسجيل حضور' },
                { href: 'announcements.html', icon: '📢', text: 'إضافة إعلان' },
                { href: 'expenses.html', icon: '💰', text: 'إضافة مصروف' }
            ];
            
            // بناء آخر الطلاب
            const recentStudentsHtml = recentData.recentStudents.length > 0 ? 
                recentData.recentStudents.map(student => `
                    <div class="list-item">
                        <div class="avatar avatar-blue">${escapeHtml(student.name.charAt(0))}</div>
                        <div class="list-item-content">
                            <p class="list-item-title">${escapeHtml(student.name)}</p>
                            <p class="list-item-subtitle">كود: ${escapeHtml(student.studentCode)}</p>
                        </div>
                        <span class="badge badge-success">نشط</span>
                    </div>
                `).join('') :
                '<div class="empty-state"><div class="empty-state-icon">📋</div><p>لا يوجد طلاب</p></div>';
            
            // بناء آخر الإعلانات
            const recentAnnouncementsHtml = stats.announcements.length > 0 ?
                stats.announcements.map(announcement => `
                    <div class="list-item">
                        <div class="list-item-icon" style="background: var(--royal-light);">📢</div>
                        <div class="list-item-content">
                            <p class="list-item-title">${escapeHtml(announcement.title)}</p>
                            <p class="list-item-subtitle">${formatDate(announcement.createdAt)}</p>
                        </div>
                    </div>
                `).join('') :
                '<div class="empty-state"><div class="empty-state-icon">📢</div><p>لا توجد إعلانات</p></div>';
            
            // بناء آخر العمليات
            const recentLogsHtml = recentData.recentLogs.length > 0 ?
                recentData.recentLogs.map(log => `
                    <div class="list-item">
                        <div class="list-item-icon" style="background: var(--warning-bg);">📋</div>
                        <div class="list-item-content">
                            <p class="list-item-title">${escapeHtml(log.action)}</p>
                            <p class="list-item-subtitle">${formatDate(log.createdAt)}</p>
                        </div>
                    </div>
                `).join('') :
                '<div class="empty-state"><div class="empty-state-icon">📋</div><p>لا توجد عمليات</p></div>';
            
            // بناء الصفحة الكاملة
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">لوحة التحكم</h1>
                                <p class="page-subtitle">مرحبًا ${escapeHtml(profile.name)} 👋</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="window.location.href='students.html'">
                                    + إضافة طالب
                                </button>
                            </div>
                        </div>
                        
                        <!-- Statistics -->
                        <div class="stats-grid">
                            ${statsCards.join('')}
                        </div>
                        
                        <!-- Attendance Statistics -->
                        <div class="stats-grid stats-grid-3 mt-2">
                            ${attendanceCards.join('')}
                        </div>
                        
                        <!-- Quick Actions -->
                        <div class="card mt-2">
                            <div class="card-header">
                                <h3 class="card-title">إجراءات سريعة</h3>
                            </div>
                            <div class="quick-actions">
                                ${quickActions.map(action => `
                                    <a href="${action.href}" class="quick-action">
                                        <div class="quick-action-icon">${action.icon}</div>
                                        <span class="quick-action-text">${action.text}</span>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Recent Data -->
                        <div class="dashboard-grid mt-2">
                            <!-- Recent Students -->
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">آخر الطلاب</h3>
                                    <a href="students.html" class="btn btn-sm btn-outline">عرض الكل</a>
                                </div>
                                <div class="card-body">
                                    ${recentStudentsHtml}
                                </div>
                            </div>
                            
                            <!-- Recent Announcements -->
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">آخر الإعلانات</h3>
                                    <a href="announcements.html" class="btn btn-sm btn-outline">عرض الكل</a>
                                </div>
                                <div class="card-body">
                                    ${recentAnnouncementsHtml}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Recent Logs -->
                        <div class="card mt-2">
                            <div class="card-header">
                                <h3 class="card-title">آخر العمليات</h3>
                                <a href="logs.html" class="btn btn-sm btn-outline">عرض الكل</a>
                            </div>
                            <div class="card-body">
                                ${recentLogsHtml}
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            // إضافة مستمعي الأحداث
            setupEventListeners();
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            // زر القائمة
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }
            
            // الـ overlay
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', toggleSidebar);
            }
            
            // زر تسجيل الخروج
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', handleLogout);
            }
        }
        
        // تبديل القائمة الجانبية
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initDashboard();
    </script>
</body>
</html>
