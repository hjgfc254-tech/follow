<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>لوحة التحكم | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>
    
    <script type="module">
        import { requireAuth } from '../js/auth.js';
        import { getAllDocuments, getDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatCard, handleLogout, toggleSidebar } from '../js/components.js';
        import { formatDate, escapeHtml } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'dashboard';
        
        async function initDashboard() {
            try {
                const user = await requireAuth(['admin', 'super_admin']);
                if (!user) return;
                
                if (!isAdmin(user)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                // تحميل البيانات بالتوازي
                const [students, teachers, stages, classes, announcements, messages, events] = await Promise.all([
                    getAllDocuments('students'),
                    getAllDocuments('teachers'),
                    getAllDocuments('stages'),
                    getAllDocuments('classes'),
                    getDocuments('announcements', [
                        { field: 'status', operator: '==', value: 'published' }
                    ], { orderBy: 'createdAt', orderDirection: 'desc', limit: 5 }),
                    getDocuments('messages', [
                        { field: 'receiverId', operator: '==', value: user.code }
                    ], { orderBy: 'createdAt', orderDirection: 'desc', limit: 5 }),
                    getDocuments('events', [], { orderBy: 'date', orderDirection: 'desc', limit: 5 })
                ]);
                
                buildDashboard(user, { students, teachers, stages, classes, announcements, messages, events });
                
            } catch (error) {
                console.error('Error:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function buildDashboard(user, data) {
            const activeStudents = data.students.filter(s => s.status === 'active').length;
            const activeTeachers = data.teachers.filter(t => t.status === 'active').length;
            const activeStages = data.stages.filter(s => s.status === 'active').length;
            const activeClasses = data.classes.filter(c => c.status === 'active').length;
            const unreadMessages = data.messages.filter(m => !m.isRead).length;
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${renderSidebar(user, currentPage)}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${renderHeader(user)}
                    </header>
                    <main class="main-content-inner">
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">لوحة التحكم</h1>
                                <p class="page-subtitle">مرحبًا ${escapeHtml(user.name)} 👋</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="window.location.href='students.html'">
                                    <i class="fas fa-plus"></i>
                                    إضافة طالب
                                </button>
                            </div>
                        </div>
                        
                        <!-- الإحصائيات -->
                        <div class="stats-grid">
                            ${renderStatCard({ label: 'الطلاب', value: activeStudents, icon: 'fa-user-graduate', color: 'royal' })}
                            ${renderStatCard({ label: 'المعلمون', value: activeTeachers, icon: 'fa-chalkboard-teacher', color: 'success' })}
                            ${renderStatCard({ label: 'المراحل', value: activeStages, icon: 'fa-layer-group', color: 'warning' })}
                            ${renderStatCard({ label: 'الفصول', value: activeClasses, icon: 'fa-book-open', color: 'red' })}
                        </div>
                        
                        <!-- إجراءات سريعة -->
                        <div class="card mt-3">
                            <div class="card-header">
                                <h3 class="card-title">إجراءات سريعة</h3>
                            </div>
                            <div class="card-body">
                                <div class="quick-actions">
                                    <a href="students.html" class="quick-action">
                                        <i class="fas fa-user-graduate"></i>
                                        <span>إضافة طالب</span>
                                    </a>
                                    <a href="teachers.html" class="quick-action">
                                        <i class="fas fa-chalkboard-teacher"></i>
                                        <span>إضافة معلم</span>
                                    </a>
                                    <a href="stages.html" class="quick-action">
                                        <i class="fas fa-layer-group"></i>
                                        <span>إضافة مرحلة</span>
                                    </a>
                                    <a href="announcements.html" class="quick-action">
                                        <i class="fas fa-bell"></i>
                                        <span>إعلان جديد</span>
                                    </a>
                                    <a href="messages.html" class="quick-action">
                                        <i class="fas fa-envelope"></i>
                                        <span>رسالة جديدة</span>
                                    </a>
                                    <a href="events.html" class="quick-action">
                                        <i class="fas fa-calendar-alt"></i>
                                        <span>حدث جديد</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <!-- آخر الإعلانات والأحداث -->
                        <div class="dashboard-grid mt-3">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">آخر الإعلانات</h3>
                                    <a href="announcements.html" class="btn btn-sm btn-outline">عرض الكل</a>
                                </div>
                                <div class="card-body">
                                    ${data.announcements.length > 0 ? data.announcements.map(a => `
                                        <div class="list-item">
                                            <div class="list-item-icon"><i class="fas fa-bell"></i></div>
                                            <div class="list-item-content">
                                                <p class="list-item-title">${escapeHtml(a.title)}</p>
                                                <p class="list-item-subtitle">${formatDate(a.createdAt)}</p>
                                            </div>
                                        </div>
                                    `).join('') : '<p class="text-muted text-center">لا توجد إعلانات</p>'}
                                </div>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">آخر الأحداث</h3>
                                    <a href="events.html" class="btn btn-sm btn-outline">عرض الكل</a>
                                </div>
                                <div class="card-body">
                                    ${data.events.length > 0 ? data.events.map(e => `
                                        <div class="list-item">
                                            <div class="list-item-icon"><i class="fas fa-calendar-alt"></i></div>
                                            <div class="list-item-content">
                                                <p class="list-item-title">${escapeHtml(e.title)}</p>
                                                <p class="list-item-subtitle">${formatDate(e.date)}</p>
                                            </div>
                                        </div>
                                    `).join('') : '<p class="text-muted text-center">لا توجد أحداث</p>'}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            setupEvents(user);
        }
        
        function setupEvents(user) {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        initDashboard();
    </script>
</body>
</html>
