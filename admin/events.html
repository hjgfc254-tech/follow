<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>الأحداث | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>
    
    <script type="module">
        import { requireAuth } from '../js/auth.js';
        import { getDocuments, createDocument, updateDocument, deleteDocument } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout, toggleSidebar } from '../js/components.js';
        import { showToast, escapeHtml, confirmAction, validateRequired, formatDate, getTodayDate } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'events';
        
        let allEvents = [];
        let currentUser = null;
        let currentFilter = 'upcoming';
        
        async function initEvents() {
            try {
                currentUser = await requireAuth(['admin', 'super_admin']);
                if (!currentUser) return;
                
                if (!isAdmin(currentUser)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                allEvents = await getDocuments('events', [], { orderBy: 'date', orderDirection: 'desc' });
                
                buildPage();
                
            } catch (error) {
                console.error('Error:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function buildPage() {
            const filteredEvents = getFilteredEvents();
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${renderSidebar(currentUser, currentPage)}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${renderHeader(currentUser)}
                    </header>
                    <main class="main-content-inner">
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الأحداث</h1>
                                <p class="page-subtitle">إجمالي الأحداث: ${allEvents.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddModal()">
                                    <i class="fas fa-plus"></i>
                                    حدث جديد
                                </button>
                            </div>
                        </div>
                        
                        <!-- Filters -->
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn ${currentFilter === 'upcoming' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('upcoming')">القادمة</button>
                            <button class="btn ${currentFilter === 'past' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('past')">السابقة</button>
                            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('all')">الكل</button>
                        </div>
                        
                        <!-- عرض الأحداث -->
                        <div id="eventsList">
                            ${renderEvents(filteredEvents)}
                        </div>
                    </main>
                </div>
                
                <!-- Modal إضافة/تعديل -->
                <div class="modal-overlay" id="eventModal" style="display: none;">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">حدث جديد</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="eventId">
                            
                            <div class="form-group">
                                <label class="form-label">عنوان الحدث <span class="required">*</span></label>
                                <input type="text" class="form-control" id="eventTitle" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الوصف</label>
                                <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">التاريخ <span class="required">*</span></label>
                                <input type="date" class="form-control" id="eventDate" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الموقع</label>
                                <input type="text" class="form-control" id="eventLocation" placeholder="المدرسة">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الحالة</label>
                                <select class="form-control" id="eventStatus">
                                    <option value="published">منشور</option>
                                    <option value="cancelled">ملغي</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveEvent()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEvents();
        }
        
        function getFilteredEvents() {
            const today = getTodayDate();
            
            switch (currentFilter) {
                case 'upcoming':
                    return allEvents.filter(e => e.date >= today && e.status !== 'cancelled');
                case 'past':
                    return allEvents.filter(e => e.date < today || e.status === 'cancelled');
                case 'all':
                default:
                    return allEvents;
            }
        }
        
        function renderEvents(events) {
            if (events.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-calendar-alt"></i></div>
                        <div class="empty-state-title">لا توجد أحداث</div>
                        <div class="empty-state-text">لم يتم إضافة أي حدث بعد</div>
                    </div>
                `;
            }
            
            return `
                <div class="timeline">
                    ${events.map(event => {
                        const eventDate = new Date(event.date);
                        const day = String(eventDate.getDate()).padStart(2, '0');
                        const month = eventDate.toLocaleDateString('ar-EG', { month: 'short' });
                        
                        return `
                            <div class="timeline-item">
                                <div class="timeline-dot"></div>
                                <div class="event-card">
                                    <div class="event-date-box">
                                        <span class="event-date-day">${day}</span>
                                        <span class="event-date-month">${month}</span>
                                    </div>
                                    <div class="event-details">
                                        <div class="d-flex justify-between items-center flex-wrap gap-2">
                                            <h3 class="event-title">${escapeHtml(event.title)}</h3>
                                            ${renderStatusBadge(event.status || 'published')}
                                        </div>
                                        
                                        ${event.description ? `<p class="event-info">${escapeHtml(event.description)}</p>` : ''}
                                        
                                        <div class="d-flex items-center gap-2 flex-wrap">
                                            <span class="event-info mb-0">📅 ${formatDate(event.date)}</span>
                                            ${event.location ? `<span class="event-info mb-0">📍 ${escapeHtml(event.location)}</span>` : ''}
                                        </div>
                                        
                                        <div class="d-flex gap-1 mt-2">
                                            <button class="btn btn-sm btn-outline" onclick="editEvent('${event.id}')">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteEvent('${event.id}')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        function setupEvents() {
            document.getElementById('sidebarToggle')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);
            document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
        }
        
        window.filterEvents = function(filter) {
            currentFilter = filter;
            buildPage();
        };
        
        window.openAddModal = function() {
            document.getElementById('modalTitle').textContent = 'حدث جديد';
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventDate').value = getTodayDate();
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventStatus').value = 'published';
            document.getElementById('eventModal').style.display = 'flex';
        };
        
        window.closeModal = function() {
            document.getElementById('eventModal').style.display = 'none';
        };
        
        window.editEvent = function(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل حدث';
            document.getElementById('eventId').value = eventId;
            document.getElementById('eventTitle').value = event.title || '';
            document.getElementById('eventDescription').value = event.description || '';
            document.getElementById('eventDate').value = event.date || '';
            document.getElementById('eventLocation').value = event.location || '';
            document.getElementById('eventStatus').value = event.status || 'published';
            document.getElementById('eventModal').style.display = 'flex';
        };
        
        window.saveEvent = async function() {
            const eventId = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            const date = document.getElementById('eventDate').value;
            const location = document.getElementById('eventLocation').value.trim();
            const status = document.getElementById('eventStatus').value;
            
            if (!validateRequired(title)) {
                showToast('الرجاء إدخال عنوان الحدث', 'warning');
                return;
            }
            
            if (!date) {
                showToast('الرجاء اختيار التاريخ', 'warning');
                return;
            }
            
            const eventData = {
                title,
                description,
                date,
                location,
                status,
                createdBy: currentUser.code
            };
            
            try {
                if (eventId) {
                    await updateDocument('events', eventId, eventData);
                    showToast('تم تحديث الحدث بنجاح', 'success');
                } else {
                    await createDocument('events', eventData);
                    showToast('تم إضافة الحدث بنجاح', 'success');
                }
                
                closeModal();
                location.reload();
                
            } catch (error) {
                console.error('Error saving event:', error);
                showToast('حدث خطأ أثناء الحفظ', 'error');
            }
        };
        
        window.deleteEvent = async function(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;
            
            const confirmed = await confirmAction(`هل أنت متأكد من حذف الحدث "${event.title}"؟`, 'تأكيد الحذف');
            if (!confirmed) return;
            
            try {
                await deleteDocument('events', eventId);
                showToast('تم حذف الحدث بنجاح', 'success');
                location.reload();
            } catch (error) {
                console.error('Error deleting event:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        initEvents();
    </script>
</body>
</html>
