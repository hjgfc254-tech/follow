<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأحداث | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الأحداث...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { 
            getAllDocuments, 
            getDocuments, 
            createDocument, 
            updateDocument, 
            deleteDocument 
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { 
            formatDate, 
            formatDateTime,
            getDayName,
            showToast, 
            escapeHtml, 
            confirmAction,
            validateRequired,
            getTodayDate
        } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'events';
        
        let allEvents = [];
        let currentProfile = null;
        let currentFilter = 'upcoming'; // upcoming, past, all
        
        // تهيئة الصفحة
        async function initEvents() {
            try {
                currentProfile = await requireAuth(['admin', 'super_admin']);
                if (!currentProfile) return;
                
                if (!isAdmin(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing events:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                allEvents = await getDocuments('events', [], { 
                    orderBy: 'date', 
                    orderDirection: 'desc' 
                });
            } catch (error) {
                console.error('Error loading events:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الأحداث');
            
            const filteredEvents = getFilteredEvents();
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الأحداث والأخبار</h1>
                                <p class="page-subtitle">إجمالي الأحداث: ${allEvents.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddEventModal()">
                                    + حدث جديد
                                </button>
                            </div>
                        </div>
                        
                        <!-- Filters -->
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn ${currentFilter === 'upcoming' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('upcoming')">
                                القادمة
                            </button>
                            <button class="btn ${currentFilter === 'past' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('past')">
                                السابقة
                            </button>
                            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('all')">
                                الكل
                            </button>
                        </div>
                        
                        <!-- Events Timeline -->
                        <div class="timeline" id="eventsTimeline">
                            ${renderEventsTimeline(filteredEvents)}
                        </div>
                    </main>
                </div>
                
                <!-- Add/Edit Event Modal -->
                <div class="modal-overlay" id="eventModal" style="display: none;">
                    <div class="modal" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">حدث جديد</h3>
                            <button class="modal-close" onclick="closeEventModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="eventForm">
                                <input type="hidden" id="eventId">
                                
                                <div class="form-group">
                                    <label class="form-label required">عنوان الحدث</label>
                                    <input type="text" class="form-control" id="eventTitle" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">وصف الحدث</label>
                                    <textarea class="form-control" id="eventDescription" rows="4"></textarea>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label required">التاريخ</label>
                                        <input type="date" class="form-control" id="eventDate" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">الموقع</label>
                                        <input type="text" class="form-control" id="eventLocation" placeholder="المدرسة">
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">وقت البداية</label>
                                        <input type="time" class="form-control" id="eventStartTime">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">وقت النهاية</label>
                                        <input type="time" class="form-control" id="eventEndTime">
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الحالة</label>
                                    <select class="form-control" id="eventStatus">
                                        <option value="published">منشور</option>
                                        <option value="draft">مسودة</option>
                                        <option value="cancelled">ملغي</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeEventModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveEvent()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // الحصول على الأحداث المفلترة
        function getFilteredEvents() {
            const today = getTodayDate();
            
            switch (currentFilter) {
                case 'upcoming':
                    return allEvents.filter(e => e.date >= today && e.status !== 'cancelled');
                case 'past':
                    return allEvents.filter(e => e.date < today || e.status === 'cancelled');
                case 'all':
                default:
                    return allEvents;
            }
        }
        
        // عرض الأحداث في Timeline
        function renderEventsTimeline(events) {
            if (events.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">لا توجد أحداث</div>
                        <div class="empty-state-text">لم يتم إضافة أي حدث بعد</div>
                        <button class="btn btn-primary mt-2" onclick="openAddEventModal()">
                            + إضافة أول حدث
                        </button>
                    </div>
                `;
            }
            
            return events.map(event => {
                const eventDate = new Date(event.date);
                const day = String(eventDate.getDate()).padStart(2, '0');
                const month = eventDate.toLocaleDateString('ar-EG', { month: 'short' });
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="event-card">
                            <div class="event-date-box">
                                <span class="event-date-day">${day}</span>
                                <span class="event-date-month">${month}</span>
                            </div>
                            <div class="event-details">
                                <div class="d-flex justify-between items-center flex-wrap gap-2">
                                    <h3 class="event-title">${escapeHtml(event.title)}</h3>
                                    ${renderStatusBadge(event.status)}
                                </div>
                                
                                ${event.description ? `<p class="event-info">${escapeHtml(event.description)}</p>` : ''}
                                
                                <div class="d-flex items-center gap-2 flex-wrap">
                                    <span class="event-info mb-0">📅 ${formatDate(event.date)} (${getDayName(event.date)})</span>
                                    ${event.location ? `<span class="event-info mb-0">📍 ${escapeHtml(event.location)}</span>` : ''}
                                    ${event.startTime ? `<span class="event-info mb-0">🕐 ${event.startTime}${event.endTime ? ' - ' + event.endTime : ''}</span>` : ''}
                                </div>
                                
                                <div class="d-flex gap-1 mt-2">
                                    <button class="btn btn-sm btn-outline" onclick="editEvent('${event.id}')">تعديل</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteEvent('${event.id}')">حذف</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // فلترة الأحداث
        window.filterEvents = function(filter) {
            currentFilter = filter;
            buildPage(currentProfile);
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // فتح modal
        window.openAddEventModal = function() {
            document.getElementById('modalTitle').textContent = 'حدث جديد';
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventDate').value = getTodayDate();
            document.getElementById('eventStatus').value = 'published';
            document.getElementById('eventModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeEventModal = function() {
            document.getElementById('eventModal').style.display = 'none';
            document.body.style.overflow = '';
        };
        
        // تعديل حدث
        window.editEvent = function(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل حدث';
            document.getElementById('eventId').value = eventId;
            document.getElementById('eventTitle').value = event.title || '';
            document.getElementById('eventDescription').value = event.description || '';
            document.getElementById('eventDate').value = event.date || '';
            document.getElementById('eventLocation').value = event.location || '';
            document.getElementById('eventStartTime').value = event.startTime || '';
            document.getElementById('eventEndTime').value = event.endTime || '';
            document.getElementById('eventStatus').value = event.status || 'published';
            
            document.getElementById('eventModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        // حفظ حدث
        window.saveEvent = async function() {
            const eventId = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            const date = document.getElementById('eventDate').value;
            const location = document.getElementById('eventLocation').value.trim();
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const status = document.getElementById('eventStatus').value;
            
            if (!validateRequired(title)) {
                showToast('الرجاء إدخال عنوان الحدث', 'warning');
                return;
            }
            
            if (!date) {
                showToast('الرجاء اختيار التاريخ', 'warning');
                return;
            }
            
            const eventData = {
                title,
                description,
                date,
                location,
                startTime,
                endTime,
                status,
                createdBy: currentProfile.uid
            };
            
            try {
                if (eventId) {
                    await updateDocument('events', eventId, eventData);
                    showToast('تم تحديث الحدث بنجاح', 'success');
                } else {
                    await createDocument('events', eventData);
                    showToast('تم إضافة الحدث بنجاح', 'success');
                }
                
                closeEventModal();
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error saving event:', error);
                showToast('حدث خطأ أثناء حفظ الحدث', 'error');
            }
        };
        
        // حذف حدث
        window.deleteEvent = async function(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;
            
            const confirmed = await confirmAction(
                `هل أنت متأكد من حذف الحدث "${event.title}"؟`,
                'تأكيد الحذف'
            );
            
            if (!confirmed) return;
            
            try {
                await deleteDocument('events', eventId);
                showToast('تم حذف الحدث بنجاح', 'success');
                await loadData();
                buildPage(currentProfile);
            } catch (error) {
                console.error('Error deleting event:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        // بدء التحميل
        initEvents();
    </script>
</body>
</html>
