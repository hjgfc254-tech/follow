<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المراحل | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل المراحل...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { 
            getAllDocuments, 
            createDocument, 
            updateDocument, 
            deleteDocument 
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { showToast, escapeHtml, confirmAction, validateRequired } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'stages';
        
        let allStages = [];
        
        // تهيئة الصفحة
        async function initStages() {
            try {
                const profile = await requireAuth(['admin', 'super_admin']);
                if (!profile) return;
                
                if (!isAdmin(profile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(profile);
                
            } catch (error) {
                console.error('Error initializing stages:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                allStages = await getAllDocuments('stages');
            } catch (error) {
                console.error('Error loading stages:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'إدارة المراحل');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">إدارة المراحل الدراسية</h1>
                                <p class="page-subtitle">إجمالي المراحل: ${allStages.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddStageModal()">
                                    + إضافة مرحلة
                                </button>
                            </div>
                        </div>
                        
                        <!-- Stages Grid -->
                        <div class="dashboard-grid-3" id="stagesGrid">
                            ${renderStagesGrid(allStages)}
                        </div>
                    </main>
                </div>
                
                <!-- Add/Edit Stage Modal -->
                <div class="modal-overlay" id="stageModal" style="display: none;">
                    <div class="modal" style="max-width: 500px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">إضافة مرحلة</h3>
                            <button class="modal-close" onclick="closeStageModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="stageForm">
                                <input type="hidden" id="stageId">
                                
                                <div class="form-group">
                                    <label class="form-label required">اسم المرحلة</label>
                                    <input type="text" class="form-control" id="stageName" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الكود</label>
                                    <input type="text" class="form-control" id="stageCode" placeholder="PRIMARY">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الترتيب</label>
                                    <input type="number" class="form-control" id="stageOrder" min="1" value="1">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الحالة</label>
                                    <select class="form-control" id="stageStatus">
                                        <option value="active">نشط</option>
                                        <option value="inactive">غير نشط</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeStageModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveStage()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض المراحل
        function renderStagesGrid(stages) {
            if (stages.length === 0) {
                return `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📚</div>
                        <div class="empty-state-title">لا توجد مراحل</div>
                        <div class="empty-state-text">لم يتم العثور على أي مرحلة دراسية</div>
                    </div>
                `;
            }
            
            return stages.map(stage => `
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-between items-center mb-2">
                            <div class="d-flex items-center gap-2">
                                <div class="stat-icon blue" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--royal-light); color: var(--royal);">
                                    📚
                                </div>
                                <div>
                                    <h3 class="card-title mb-0">${escapeHtml(stage.name)}</h3>
                                    <p class="text-muted mb-0" style="font-size: 0.85rem;">${escapeHtml(stage.code || '')}</p>
                                </div>
                            </div>
                            ${renderStatusBadge(stage.status)}
                        </div>
                        
                        <div class="d-flex justify-between items-center mt-2">
                            <span class="text-muted" style="font-size: 0.85rem;">الترتيب: ${stage.order || 1}</span>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm btn-outline" onclick="editStage('${stage.id}')">تعديل</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteStage('${stage.id}')">حذف</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // فتح modal
        window.openAddStageModal = function() {
            document.getElementById('modalTitle').textContent = 'إضافة مرحلة';
            document.getElementById('stageForm').reset();
            document.getElementById('stageId').value = '';
            document.getElementById('stageOrder').value = allStages.length + 1;
            document.getElementById('stageModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeStageModal = function() {
            document.getElementById('stageModal').style.display = 'none';
            document.body.style.overflow = '';
        };
        
        // تعديل مرحلة
        window.editStage = function(stageId) {
            const stage = allStages.find(s => s.id === stageId);
            if (!stage) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل مرحلة';
            document.getElementById('stageId').value = stageId;
            document.getElementById('stageName').value = stage.name || '';
            document.getElementById('stageCode').value = stage.code || '';
            document.getElementById('stageOrder').value = stage.order || 1;
            document.getElementById('stageStatus').value = stage.status || 'active';
            
            document.getElementById('stageModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        // حفظ مرحلة
        window.saveStage = async function() {
            const stageId = document.getElementById('stageId').value;
            const stageName = document.getElementById('stageName').value.trim();
            const stageCode = document.getElementById('stageCode').value.trim();
            const stageOrder = parseInt(document.getElementById('stageOrder').value) || 1;
            const stageStatus = document.getElementById('stageStatus').value;
            
            if (!validateRequired(stageName)) {
                showToast('الرجاء إدخال اسم المرحلة', 'warning');
                return;
            }
            
            const stageData = {
                name: stageName,
                code: stageCode,
                order: stageOrder,
                status: stageStatus
            };
            
            try {
                if (stageId) {
                    await updateDocument('stages', stageId, stageData);
                    showToast('تم تحديث المرحلة بنجاح', 'success');
                } else {
                    await createDocument('stages', stageData);
                    showToast('تم إضافة المرحلة بنجاح', 'success');
                }
                
                closeStageModal();
                await loadData();
                buildPage(await requireAuth(['admin', 'super_admin']));
                
            } catch (error) {
                console.error('Error saving stage:', error);
                showToast('حدث خطأ أثناء حفظ البيانات', 'error');
            }
        };
        
        // حذف مرحلة
        window.deleteStage = async function(stageId) {
            const stage = allStages.find(s => s.id === stageId);
            if (!stage) return;
            
            const confirmed = await confirmAction(
                `هل أنت متأكد من حذف المرحلة "${stage.name}"؟`,
                'تأكيد الحذف'
            );
            
            if (!confirmed) return;
            
            try {
                await deleteDocument('stages', stageId);
                showToast('تم حذف المرحلة بنجاح', 'success');
                await loadData();
                buildPage(await requireAuth(['admin', 'super_admin']));
            } catch (error) {
                console.error('Error deleting stage:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        // بدء التحميل
        initStages();
    </script>
</body>
</html>
