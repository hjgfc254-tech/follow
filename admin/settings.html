<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الإعدادات...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocument, setDocument, updateDocument } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { showToast, escapeHtml, validateRequired } from '../js/utils.js';
        import { isAdmin, isSuperAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'settings';
        
        let currentProfile = null;
        let currentSettings = null;
        
        // تهيئة الصفحة
        async function initSettings() {
            try {
                currentProfile = await requireAuth(['admin', 'super_admin']);
                if (!currentProfile) return;
                
                if (!isAdmin(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadSettings();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing settings:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل الإعدادات
        async function loadSettings() {
            try {
                currentSettings = await getDocument('settings', 'general');
                
                // إذا لم توجد إعدادات، استخدم الافتراضية
                if (!currentSettings) {
                    currentSettings = {
                        schoolName: 'مدارس الجيل الجديد الخاصة',
                        schoolDescription: 'منصة إدارة ومتابعة الطلاب',
                        academicYear: '2026/2027',
                        maintenanceMode: false,
                        schoolPhone: '',
                        schoolEmail: '',
                        schoolAddress: ''
                    };
                }
            } catch (error) {
                console.error('Error loading settings:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الإعدادات');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">إعدادات النظام</h1>
                                <p class="page-subtitle">تخصيص إعدادات المدرسة</p>
                            </div>
                        </div>
                        
                        <div class="dashboard-grid">
                            <!-- School Information -->
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">معلومات المدرسة</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label class="form-label required">اسم المدرسة</label>
                                        <input type="text" class="form-control" id="schoolName" 
                                               value="${escapeHtml(currentSettings.schoolName)}">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">وصف المدرسة</label>
                                        <textarea class="form-control" id="schoolDescription" rows="3">${escapeHtml(currentSettings.schoolDescription)}</textarea>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">العام الدراسي</label>
                                        <input type="text" class="form-control" id="academicYear" 
                                               value="${escapeHtml(currentSettings.academicYear)}">
                                    </div>
                                    
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label class="form-label">هاتف المدرسة</label>
                                            <input type="tel" class="form-control" id="schoolPhone" 
                                                   value="${escapeHtml(currentSettings.schoolPhone || '')}" dir="ltr">
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label">البريد الإلكتروني</label>
                                            <input type="email" class="form-control" id="schoolEmail" 
                                                   value="${escapeHtml(currentSettings.schoolEmail || '')}" dir="ltr">
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">عنوان المدرسة</label>
                                        <input type="text" class="form-control" id="schoolAddress" 
                                               value="${escapeHtml(currentSettings.schoolAddress || '')}">
                                    </div>
                                    
                                    <button class="btn btn-primary" onclick="saveSchoolInfo()">
                                        حفظ معلومات المدرسة
                                    </button>
                                </div>
                            </div>
                            
                            <!-- System Settings -->
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">إعدادات النظام</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label class="form-label">وضع الصيانة</label>
                                        <div class="d-flex items-center gap-2">
                                            <label class="d-flex items-center gap-2 cursor-pointer">
                                                <input type="checkbox" id="maintenanceMode" 
                                                       ${currentSettings.maintenanceMode ? 'checked' : ''}>
                                                <span>تفعيل وضع الصيانة</span>
                                            </label>
                                        </div>
                                        <div class="form-text">
                                            عند التفعيل، لن يتمكن المستخدمون من تسجيل الدخول
                                        </div>
                                    </div>
                                    
                                    <button class="btn btn-warning" onclick="toggleMaintenanceMode()">
                                        حفظ إعدادات النظام
                                    </button>
                                    
                                    <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border);">
                                    
                                    <h4 class="mb-2">معلومات النظام</h4>
                                    <div class="d-flex justify-between mb-1">
                                        <span class="text-muted">إصدار النظام</span>
                                        <span class="font-numbers">1.0.0</span>
                                    </div>
                                    <div class="d-flex justify-between mb-1">
                                        <span class="text-muted">آخر تحديث</span>
                                        <span>${currentSettings.updatedAt ? new Date(currentSettings.updatedAt.toDate()).toLocaleDateString('ar-EG') : '—'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        ${isSuperAdmin(profile) ? `
                        <!-- Admin Management (Super Admin Only) -->
                        <div class="card mt-2">
                            <div class="card-header">
                                <h3 class="card-title">إدارة المشرفين</h3>
                                <span class="badge badge-premium">Super Admin</span>
                            </div>
                            <div class="card-body">
                                <p class="text-muted">
                                    هذه الميزة متاحة فقط للمدير العام للنظام.
                                    يمكنك إدارة صلاحيات المشرفين من هنا.
                                </p>
                                <button class="btn btn-outline" disabled>
                                    إدارة المشرفين (قريبًا)
                                </button>
                            </div>
                        </div>
                        ` : ''}
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // حفظ معلومات المدرسة
        window.saveSchoolInfo = async function() {
            const schoolName = document.getElementById('schoolName').value.trim();
            const schoolDescription = document.getElementById('schoolDescription').value.trim();
            const academicYear = document.getElementById('academicYear').value.trim();
            const schoolPhone = document.getElementById('schoolPhone').value.trim();
            const schoolEmail = document.getElementById('schoolEmail').value.trim();
            const schoolAddress = document.getElementById('schoolAddress').value.trim();
            
            if (!validateRequired(schoolName)) {
                showToast('الرجاء إدخال اسم المدرسة', 'warning');
                return;
            }
            
            try {
                await setDocument('settings', 'general', {
                    schoolName,
                    schoolDescription,
                    academicYear,
                    schoolPhone,
                    schoolEmail,
                    schoolAddress,
                    maintenanceMode: currentSettings.maintenanceMode || false
                });
                
                showToast('تم حفظ معلومات المدرسة بنجاح', 'success');
                await loadSettings();
                
            } catch (error) {
                console.error('Error saving settings:', error);
                showToast('حدث خطأ أثناء حفظ الإعدادات', 'error');
            }
        };
        
        // تبديل وضع الصيانة
        window.toggleMaintenanceMode = async function() {
            const maintenanceMode = document.getElementById('maintenanceMode').checked;
            
            try {
                await setDocument('settings', 'general', {
                    schoolName: document.getElementById('schoolName').value.trim(),
                    schoolDescription: document.getElementById('schoolDescription').value.trim(),
                    academicYear: document.getElementById('academicYear').value.trim(),
                    schoolPhone: document.getElementById('schoolPhone').value.trim(),
                    schoolEmail: document.getElementById('schoolEmail').value.trim(),
                    schoolAddress: document.getElementById('schoolAddress').value.trim(),
                    maintenanceMode
                });
                
                showToast(
                    maintenanceMode ? 'تم تفعيل وضع الصيانة' : 'تم إلغاء وضع الصيانة',
                    'success'
                );
                await loadSettings();
                
            } catch (error) {
                console.error('Error toggling maintenance mode:', error);
                showToast('حدث خطأ أثناء حفظ الإعدادات', 'error');
            }
        };
        
        // بدء التحميل
        initSettings();
    </script>
</body>
</html>
