<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصروفات | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل المصروفات...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { 
            getAllDocuments, 
            getDocuments, 
            createDocument, 
            updateDocument, 
            deleteDocument 
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { 
            formatDate, 
            formatCurrency,
            showToast, 
            escapeHtml, 
            confirmAction,
            validateRequired,
            validateNumber,
            getTodayDate
        } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'expenses';
        
        let allExpenses = [];
        let allStudents = [];
        let filteredExpenses = [];
        let currentProfile = null;
        
        // تهيئة الصفحة
        async function initExpenses() {
            try {
                currentProfile = await requireAuth(['admin', 'super_admin']);
                if (!currentProfile) return;
                
                if (!isAdmin(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing expenses:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                const [expenses, students] = await Promise.all([
                    getDocuments('expenses', [], { orderBy: 'createdAt', orderDirection: 'desc' }),
                    getAllDocuments('students')
                ]);
                
                allExpenses = expenses;
                allStudents = students;
                filteredExpenses = [...expenses];
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'المصروفات');
            
            // حساب الإحصائيات
            const totalAmount = allExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
            const totalPaid = allExpenses.reduce((sum, e) => sum + (Number(e.paidAmount) || 0), 0);
            const totalRemaining = totalAmount - totalPaid;
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">المصروفات الدراسية</h1>
                                <p class="page-subtitle">إجمالي المصروفات: ${allExpenses.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddExpenseModal()">
                                    + مصروف جديد
                                </button>
                            </div>
                        </div>
                        
                        <!-- Statistics -->
                        <div class="stats-grid stats-grid-3 mb-3">
                            <div class="stat-card">
                                <div class="stat-icon blue">💰</div>
                                <div class="stat-label">إجمالي المصروفات</div>
                                <div class="stat-value">${formatCurrency(totalAmount)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon green">✅</div>
                                <div class="stat-label">المدفوع</div>
                                <div class="stat-value">${formatCurrency(totalPaid)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon red">⏳</div>
                                <div class="stat-label">المتبقي</div>
                                <div class="stat-value">${formatCurrency(totalRemaining)}</div>
                            </div>
                        </div>
                        
                        <!-- Filters -->
                        <div class="filters-container">
                            <input 
                                type="text" 
                                class="search-input" 
                                placeholder="بحث بالطالب أو العنوان..." 
                                id="searchInput"
                            >
                            <select class="filter-select" id="statusFilter">
                                <option value="">جميع الحالات</option>
                                <option value="unpaid">غير مدفوع</option>
                                <option value="partial">جزئي</option>
                                <option value="paid">مدفوع</option>
                                <option value="cancelled">ملغي</option>
                            </select>
                        </div>
                        
                        <!-- Expenses Table -->
                        <div id="expensesTable">
                            ${renderExpensesTable(filteredExpenses)}
                        </div>
                    </main>
                </div>
                
                <!-- Add/Edit Expense Modal -->
                <div class="modal-overlay" id="expenseModal" style="display: none;">
                    <div class="modal" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">مصروف جديد</h3>
                            <button class="modal-close" onclick="closeExpenseModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="expenseForm">
                                <input type="hidden" id="expenseId">
                                
                                <div class="form-group">
                                    <label class="form-label required">الطالب</label>
                                    <select class="form-control" id="expenseStudent" required>
                                        <option value="">اختر الطالب</option>
                                        ${allStudents.map(student => `
                                            <option value="${student.studentCode || student.id}">
                                                ${escapeHtml(student.name)} (${escapeHtml(student.studentCode || student.id)})
                                            </option>
                                        `).join('')}
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label required">عنوان المصروف</label>
                                    <input type="text" class="form-control" id="expenseTitle" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">وصف</label>
                                    <textarea class="form-control" id="expenseDescription" rows="3"></textarea>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label required">المبلغ الكلي</label>
                                        <input type="number" class="form-control" id="expenseAmount" 
                                               min="0" step="0.01" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">المبلغ المدفوع</label>
                                        <input type="number" class="form-control" id="expensePaidAmount" 
                                               min="0" step="0.01" value="0">
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">تاريخ الاستحقاق</label>
                                        <input type="date" class="form-control" id="expenseDueDate">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">الحالة</label>
                                        <select class="form-control" id="expenseStatus">
                                            <option value="unpaid">غير مدفوع</option>
                                            <option value="partial">جزئي</option>
                                            <option value="paid">مدفوع</option>
                                            <option value="cancelled">ملغي</option>
                                        </select>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeExpenseModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveExpense()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض جدول المصروفات
        function renderExpensesTable(expenses) {
            if (expenses.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">💰</div>
                        <div class="empty-state-title">لا توجد مصروفات</div>
                        <div class="empty-state-text">لم يتم إضافة أي مصروف بعد</div>
                    </div>
                `;
            }
            
            return `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>الطالب</th>
                                <th>العنوان</th>
                                <th>المبلغ</th>
                                <th>المدفوع</th>
                                <th>المتبقي</th>
                                <th>تاريخ الاستحقاق</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${expenses.map(expense => {
                                const student = allStudents.find(s => 
                                    s.studentCode === expense.studentId || s.id === expense.studentId
                                );
                                const remaining = (Number(expense.amount) || 0) - (Number(expense.paidAmount) || 0);
                                
                                return `
                                    <tr>
                                        <td data-label="الطالب">${escapeHtml(student?.name || expense.studentId)}</td>
                                        <td data-label="العنوان">${escapeHtml(expense.title)}</td>
                                        <td data-label="المبلغ" class="font-numbers">${formatCurrency(expense.amount)}</td>
                                        <td data-label="المدفوع" class="font-numbers">${formatCurrency(expense.paidAmount)}</td>
                                        <td data-label="المتبقي" class="font-numbers">${formatCurrency(remaining)}</td>
                                        <td data-label="الاستحقاق">${formatDate(expense.dueDate)}</td>
                                        <td data-label="الحالة">${renderExpenseStatus(expense.status)}</td>
                                        <td data-label="إجراءات" class="actions-cell">
                                            <button class="btn btn-sm btn-outline" onclick="editExpense('${expense.id}')">تعديل</button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteExpense('${expense.id}')">حذف</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        // عرض حالة المصروف
        function renderExpenseStatus(status) {
            const statusMap = {
                'unpaid': { text: 'غير مدفوع', type: 'error' },
                'partial': { text: 'جزئي', type: 'warning' },
                'paid': { text: 'مدفوع', type: 'success' },
                'cancelled': { text: 'ملغي', type: 'muted' }
            };
            
            const info = statusMap[status] || { text: status, type: 'info' };
            return `<span class="badge badge-${info.type}">${info.text}</span>`;
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.addEventListener('input', debounceSearch);
            
            const statusFilter = document.getElementById('statusFilter');
            if (statusFilter) statusFilter.addEventListener('change', applyFilters);
            
            // تحديث المبلغ المتبقي تلقائيًا
            const amountInput = document.getElementById('expenseAmount');
            const paidInput = document.getElementById('expensePaidAmount');
            if (amountInput && paidInput) {
                amountInput.addEventListener('input', updateExpenseStatus);
                paidInput.addEventListener('input', updateExpenseStatus);
            }
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        function debounceSearch() {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(() => applyFilters(), 300);
        }
        
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
            const status = document.getElementById('statusFilter')?.value || '';
            
            filteredExpenses = allExpenses.filter(expense => {
                const student = allStudents.find(s => 
                    s.studentCode === expense.studentId || s.id === expense.studentId
                );
                
                if (searchTerm) {
                    const searchFields = [
                        expense.title,
                        student?.name || '',
                        expense.studentId
                    ].join(' ').toLowerCase();
                    
                    if (!searchFields.includes(searchTerm)) return false;
                }
                
                if (status && expense.status !== status) return false;
                
                return true;
            });
            
            const expensesTable = document.getElementById('expensesTable');
            if (expensesTable) {
                expensesTable.innerHTML = renderExpensesTable(filteredExpenses);
            }
        }
        
        // تحديث حالة المصروف تلقائيًا
        function updateExpenseStatus() {
            const amount = Number(document.getElementById('expenseAmount').value) || 0;
            const paid = Number(document.getElementById('expensePaidAmount').value) || 0;
            const statusSelect = document.getElementById('expenseStatus');
            
            if (amount === 0) {
                statusSelect.value = 'unpaid';
            } else if (paid === 0) {
                statusSelect.value = 'unpaid';
            } else if (paid >= amount) {
                statusSelect.value = 'paid';
            } else {
                statusSelect.value = 'partial';
            }
        }
        
        // فتح modal
        window.openAddExpenseModal = function() {
            document.getElementById('modalTitle').textContent = 'مصروف جديد';
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseId').value = '';
            document.getElementById('expensePaidAmount').value = '0';
            document.getElementById('expenseDueDate').value = getTodayDate();
            document.getElementById('expenseStatus').value = 'unpaid';
            document.getElementById('expenseModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeExpenseModal = function() {
            document.getElementById('expenseModal').style.display = 'none';
            document.body.style.overflow = '';
        };
        
        // تعديل مصروف
        window.editExpense = function(expenseId) {
            const expense = allExpenses.find(e => e.id === expenseId);
            if (!expense) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل مصروف';
            document.getElementById('expenseId').value = expenseId;
            document.getElementById('expenseStudent').value = expense.studentId || '';
            document.getElementById('expenseTitle').value = expense.title || '';
            document.getElementById('expenseDescription').value = expense.description || '';
            document.getElementById('expenseAmount').value = expense.amount || 0;
            document.getElementById('expensePaidAmount').value = expense.paidAmount || 0;
            document.getElementById('expenseDueDate').value = expense.dueDate || '';
            document.getElementById('expenseStatus').value = expense.status || 'unpaid';
            
            document.getElementById('expenseModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        // حفظ مصروف
        window.saveExpense = async function() {
            const expenseId = document.getElementById('expenseId').value;
            const studentId = document.getElementById('expenseStudent').value;
            const title = document.getElementById('expenseTitle').value.trim();
            const description = document.getElementById('expenseDescription').value.trim();
            const amount = Number(document.getElementById('expenseAmount').value) || 0;
            const paidAmount = Number(document.getElementById('expensePaidAmount').value) || 0;
            const dueDate = document.getElementById('expenseDueDate').value;
            const status = document.getElementById('expenseStatus').value;
            
            if (!studentId) {
                showToast('الرجاء اختيار الطالب', 'warning');
                return;
            }
            
            if (!validateRequired(title)) {
                showToast('الرجاء إدخال عنوان المصروف', 'warning');
                return;
            }
            
            if (amount <= 0) {
                showToast('الرجاء إدخال مبلغ صحيح', 'warning');
                return;
            }
            
            const remainingAmount = amount - paidAmount;
            
            const expenseData = {
                studentId,
                title,
                description,
                amount,
                paidAmount,
                remainingAmount,
                dueDate,
                status,
                createdBy: currentProfile.uid
            };
            
            try {
                if (expenseId) {
                    await updateDocument('expenses', expenseId, expenseData);
                    showToast('تم تحديث المصروف بنجاح', 'success');
                } else {
                    await createDocument('expenses', expenseData);
                    showToast('تم إضافة المصروف بنجاح', 'success');
                }
                
                closeExpenseModal();
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error saving expense:', error);
                showToast('حدث خطأ أثناء حفظ المصروف', 'error');
            }
        };
        
        // حذف مصروف
        window.deleteExpense = async function(expenseId) {
            const expense = allExpenses.find(e => e.id === expenseId);
            if (!expense) return;
            
            const confirmed = await confirmAction(
                `هل أنت متأكد من حذف المصروف "${expense.title}"؟`,
                'تأكيد الحذف'
            );
            
            if (!confirmed) return;
            
            try {
                await deleteDocument('expenses', expenseId);
                showToast('تم حذف المصروف بنجاح', 'success');
                await loadData();
                buildPage(currentProfile);
            } catch (error) {
                console.error('Error deleting expense:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        // بدء التحميل
        initExpenses();
    </script>
</body>
</html>
