<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>المعلمون | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>
    
    <script type="module">
        import { requireAuth } from '../js/auth.js';
        import { getAllDocuments, setDocument, updateDocument, deleteDocument } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout, toggleSidebar } from '../js/components.js';
        import { showToast, escapeHtml, confirmAction, validateCode, validatePassword, validatePhone } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'teachers';
        
        let allTeachers = [];
        let allClasses = [];
        let filteredTeachers = [];
        let currentUser = null;
        
        async function initTeachers() {
            try {
                currentUser = await requireAuth(['admin', 'super_admin']);
                if (!currentUser) return;
                
                if (!isAdmin(currentUser)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                const [teachers, classes] = await Promise.all([
                    getAllDocuments('teachers'),
                    getAllDocuments('classes')
                ]);
                
                allTeachers = teachers;
                allClasses = classes;
                filteredTeachers = [...teachers];
                
                buildPage();
                
            } catch (error) {
                console.error('Error:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function buildPage() {
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${renderSidebar(currentUser, currentPage)}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${renderHeader(currentUser)}
                    </header>
                    <main class="main-content-inner">
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">المعلمون</h1>
                                <p class="page-subtitle">إجمالي المعلمين: ${allTeachers.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddModal()">
                                    <i class="fas fa-plus"></i>
                                    إضافة معلم
                                </button>
                            </div>
                        </div>
                        
                        <!-- البحث -->
                        <div class="filters-container">
                            <input type="text" class="search-input" placeholder="بحث بالاسم أو الكود..." id="searchInput">
                            <select class="filter-select" id="statusFilter">
                                <option value="">جميع الحالات</option>
                                <option value="active">نشط</option>
                                <option value="inactive">غير نشط</option>
                            </select>
                        </div>
                        
                        <!-- جدول المعلمين -->
                        <div id="teachersTable">
                            ${renderTable(filteredTeachers)}
                        </div>
                    </main>
                </div>
                
                <!-- Modal إضافة/تعديل -->
                <div class="modal-overlay" id="teacherModal" style="display: none;">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">إضافة معلم</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="teacherId">
                            
                            <div class="form-group">
                                <label class="form-label">اسم المعلم <span class="required">*</span></label>
                                <input type="text" class="form-control" id="teacherName" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">كود المعلم (4 أرقام) <span class="required">*</span></label>
                                <input type="text" class="form-control" id="teacherCode" maxlength="4" inputmode="numeric" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">كلمة المرور (6 أرقام) <span class="required">*</span></label>
                                <input type="password" class="form-control" id="teacherPassword" maxlength="6" inputmode="numeric" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">رقم الهاتف (اختياري)</label>
                                <input type="tel" class="form-control" id="teacherPhone" maxlength="11" inputmode="numeric" placeholder="01xxxxxxxxx">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">الفصول المسندة</label>
                                <div class="d-flex flex-wrap gap-2">
                                    ${allClasses.map(cls => `
                                        <label class="d-flex items-center gap-1" style="cursor: pointer;">
                                            <input type="checkbox" value="${cls.id}" class="class-checkbox">
                                            <span style="font-size: 13px;">${escapeHtml(cls.name)}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveTeacher()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEvents();
        }
        
        function renderTable(teachers) {
            if (teachers.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                        <div class="empty-state-title">لا يوجد معلمون</div>
                        <div class="empty-state-text">لم يتم العثور على أي معلم</div>
                    </div>
                `;
            }
            
            return `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>الكود</th>
                                <th>الاسم</th>
                                <th>الهاتف</th>
                                <th>الفصول</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${teachers.map(teacher => {
                                const teacherClasses = allClasses.filter(c => 
                                    (teacher.classIds || []).includes(c.id)
                                );
                                
                                return `
                                    <tr>
                                        <td data-label="الكود"><span class="font-numbers">${escapeHtml(teacher.teacherCode || teacher.id)}</span></td>
                                        <td data-label="الاسم">${escapeHtml(teacher.name)}</td>
                                        <td data-label="الهاتف" class="font-numbers" dir="ltr">${escapeHtml(teacher.phone || '—')}</td>
                                        <td data-label="الفصول">${teacherClasses.length > 0 ? teacherClasses.map(c => c.name).join('، ') : '—'}</td>
                                        <td data-label="الحالة">${renderStatusBadge(teacher.status || 'active')}</td>
                                        <td data-label="إجراءات" class="actions-cell">
                                            <button class="btn btn-sm btn-outline" onclick="editTeacher('${teacher.id}')">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteTeacher('${teacher.id}')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        function setupEvents() {
            document.getElementById('sidebarToggle')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);
            document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
            
            document.getElementById('searchInput')?.addEventListener('input', debounceFilter);
            document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
        }
        
        function debounceFilter() {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(applyFilters, 300);
        }
        
        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            filteredTeachers = allTeachers.filter(teacher => {
                if (search) {
                    const searchText = `${teacher.name} ${teacher.teacherCode || teacher.id}`.toLowerCase();
                    if (!searchText.includes(search)) return false;
                }
                if (status && (teacher.status || 'active') !== status) return false;
                return true;
            });
            
            document.getElementById('teachersTable').innerHTML = renderTable(filteredTeachers);
        }
        
        window.openAddModal = function() {
            document.getElementById('modalTitle').textContent = 'إضافة معلم';
            document.getElementById('teacherId').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('teacherCode').value = '';
            document.getElementById('teacherPassword').value = '';
            document.getElementById('teacherPhone').value = '';
            document.querySelectorAll('.class-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('teacherModal').style.display = 'flex';
        };
        
        window.closeModal = function() {
            document.getElementById('teacherModal').style.display = 'none';
        };
        
        window.editTeacher = function(teacherId) {
            const teacher = allTeachers.find(t => t.id === teacherId);
            if (!teacher) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل معلم';
            document.getElementById('teacherId').value = teacherId;
            document.getElementById('teacherName').value = teacher.name || '';
            document.getElementById('teacherCode').value = teacher.teacherCode || teacherId;
            document.getElementById('teacherPassword').value = teacher.password || '';
            document.getElementById('teacherPhone').value = teacher.phone || '';
            
            document.querySelectorAll('.class-checkbox').forEach(cb => {
                cb.checked = (teacher.classIds || []).includes(cb.value);
            });
            
            document.getElementById('teacherModal').style.display = 'flex';
        };
        
        window.saveTeacher = async function() {
            const teacherId = document.getElementById('teacherId').value;
            const name = document.getElementById('teacherName').value.trim();
            const code = document.getElementById('teacherCode').value.trim();
            const password = document.getElementById('teacherPassword').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();
            const classIds = Array.from(document.querySelectorAll('.class-checkbox:checked')).map(cb => cb.value);
            
            if (!name) {
                showToast('الرجاء إدخال اسم المعلم', 'warning');
                return;
            }
            
            if (!validateCode(code)) {
                showToast('الكود يجب أن يكون 4 أرقام', 'warning');
                return;
            }
            
            if (!validatePassword(password)) {
                showToast('كلمة المرور يجب أن تكون 6 أرقام', 'warning');
                return;
            }
            
            if (phone && !validatePhone(phone)) {
                showToast('رقم الهاتف غير صحيح', 'warning');
                return;
            }
            
            const codeExists = allTeachers.some(t => 
                (t.teacherCode === code || t.id === code) && t.id !== teacherId
            );
            
            if (codeExists) {
                showToast('الكود مستخدم بالفعل', 'error');
                return;
            }
            
            const teacherData = {
                name,
                teacherCode: code,
                password,
                phone: phone || '',
                classIds,
                status: 'active'
            };
            
            try {
                if (teacherId) {
                    await updateDocument('teachers', teacherId, teacherData);
                    showToast('تم تحديث المعلم بنجاح', 'success');
                } else {
                    await setDocument('teachers', code, teacherData);
                    await setDocument('users', code, {
                        code,
                        password,
                        name,
                        role: 'teacher',
                        status: 'active',
                        linkedId: code,
                        phone: phone || ''
                    });
                    showToast('تم إضافة المعلم بنجاح', 'success');
                }
                
                closeModal();
                location.reload();
                
            } catch (error) {
                console.error('Error saving teacher:', error);
                showToast('حدث خطأ أثناء الحفظ', 'error');
            }
        };
        
        window.deleteTeacher = async function(teacherId) {
            const teacher = allTeachers.find(t => t.id === teacherId);
            if (!teacher) return;
            
            const confirmed = await confirmAction(`هل أنت متأكد من حذف المعلم "${teacher.name}"؟`, 'تأكيد الحذف');
            if (!confirmed) return;
            
            try {
                await deleteDocument('teachers', teacherId);
                await deleteDocument('users', teacherId);
                showToast('تم حذف المعلم بنجاح', 'success');
                location.reload();
            } catch (error) {
                console.error('Error deleting teacher:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        initTeachers();
    </script>
</body>
</html>
