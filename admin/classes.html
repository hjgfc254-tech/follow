<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفصول | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الفصول...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { 
            getAllDocuments, 
            createDocument, 
            updateDocument, 
            deleteDocument 
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { showToast, escapeHtml, confirmAction, validateRequired } from '../js/utils.js';
        import { isAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'classes';
        
        let allClasses = [];
        let allStages = [];
        let allTeachers = [];
        
        // تهيئة الصفحة
        async function initClasses() {
            try {
                const profile = await requireAuth(['admin', 'super_admin']);
                if (!profile) return;
                
                if (!isAdmin(profile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(profile);
                
            } catch (error) {
                console.error('Error initializing classes:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                const [classes, stages, teachers] = await Promise.all([
                    getAllDocuments('classes'),
                    getAllDocuments('stages'),
                    getAllDocuments('teachers')
                ]);
                
                allClasses = classes;
                allStages = stages;
                allTeachers = teachers;
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'إدارة الفصول');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">إدارة الفصول الدراسية</h1>
                                <p class="page-subtitle">إجمالي الفصول: ${allClasses.length}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="openAddClassModal()">
                                    + إضافة فصل
                                </button>
                            </div>
                        </div>
                        
                        <!-- Classes Grid -->
                        <div class="dashboard-grid-3" id="classesGrid">
                            ${renderClassesGrid(allClasses)}
                        </div>
                    </main>
                </div>
                
                <!-- Add/Edit Class Modal -->
                <div class="modal-overlay" id="classModal" style="display: none;">
                    <div class="modal" style="max-width: 500px;">
                        <div class="modal-header">
                            <h3 class="modal-title" id="modalTitle">إضافة فصل</h3>
                            <button class="modal-close" onclick="closeClassModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="classForm">
                                <input type="hidden" id="classId">
                                
                                <div class="form-group">
                                    <label class="form-label required">اسم الفصل</label>
                                    <input type="text" class="form-control" id="className" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">كود الفصل</label>
                                    <input type="text" class="form-control" id="classCode" placeholder="5A">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label required">المرحلة الدراسية</label>
                                    <select class="form-control" id="classStage" required>
                                        <option value="">اختر المرحلة</option>
                                        ${allStages.map(stage => `
                                            <option value="${stage.id}">${escapeHtml(stage.name)}</option>
                                        `).join('')}
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">العام الدراسي</label>
                                    <input type="text" class="form-control" id="academicYear" value="2026/2027">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">المدرسون المسندون</label>
                                    <div class="teachers-checkboxes" style="display: flex; flex-wrap: wrap; gap: 10px;">
                                        ${allTeachers.map(teacher => `
                                            <label style="display: flex; align-items: center; gap: 5px;">
                                                <input type="checkbox" value="${teacher.id}" class="teacher-checkbox">
                                                ${escapeHtml(teacher.name)}
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">الحالة</label>
                                    <select class="form-control" id="classStatus">
                                        <option value="active">نشط</option>
                                        <option value="inactive">غير نشط</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeClassModal()">إلغاء</button>
                            <button class="btn btn-primary" onclick="saveClass()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض الفصول
        function renderClassesGrid(classes) {
            if (classes.length === 0) {
                return `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🏫</div>
                        <div class="empty-state-title">لا توجد فصول</div>
                        <div class="empty-state-text">لم يتم العثور على أي فصل دراسي</div>
                    </div>
                `;
            }
            
            return classes.map(cls => {
                const stage = allStages.find(s => s.id === cls.stageId);
                const classTeachers = allTeachers.filter(t => (cls.teacherIds || []).includes(t.id));
                
                return `
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-between items-center mb-2">
                                <div class="d-flex items-center gap-2">
                                    <div class="stat-icon blue" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--royal-light); color: var(--royal);">
                                        🏫
                                    </div>
                                    <div>
                                        <h3 class="card-title mb-0">${escapeHtml(cls.name)}</h3>
                                        <p class="text-muted mb-0" style="font-size: 0.85rem;">${escapeHtml(stage?.name || '')}</p>
                                    </div>
                                </div>
                                ${renderStatusBadge(cls.status)}
                            </div>
                            
                            <div class="mt-2">
                                <p class="text-muted mb-1" style="font-size: 0.85rem;">
                                    المدرسون: ${classTeachers.length > 0 ? classTeachers.map(t => t.name).join('، ') : '—'}
                                </p>
                                <p class="text-muted mb-2" style="font-size: 0.85rem;">
                                    العام الدراسي: ${escapeHtml(cls.academicYear || '—')}
                                </p>
                            </div>
                            
                            <div class="d-flex justify-end gap-1">
                                <button class="btn btn-sm btn-outline" onclick="editClass('${cls.id}')">تعديل</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteClass('${cls.id}')">حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // فتح modal
        window.openAddClassModal = function() {
            document.getElementById('modalTitle').textContent = 'إضافة فصل';
            document.getElementById('classForm').reset();
            document.getElementById('classId').value = '';
            document.getElementById('academicYear').value = '2026/2027';
            document.querySelectorAll('.teacher-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('classModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        window.closeClassModal = function() {
            document.getElementById('classModal').style.display = 'none';
            document.body.style.overflow = '';
        };
        
        // تعديل فصل
        window.editClass = function(classId) {
            const cls = allClasses.find(c => c.id === classId);
            if (!cls) return;
            
            document.getElementById('modalTitle').textContent = 'تعديل فصل';
            document.getElementById('classId').value = classId;
            document.getElementById('className').value = cls.name || '';
            document.getElementById('classCode').value = cls.code || '';
            document.getElementById('classStage').value = cls.stageId || '';
            document.getElementById('academicYear').value = cls.academicYear || '2026/2027';
            document.getElementById('classStatus').value = cls.status || 'active';
            
            document.querySelectorAll('.teacher-checkbox').forEach(cb => {
                cb.checked = (cls.teacherIds || []).includes(cb.value);
            });
            
            document.getElementById('classModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        
        // حفظ فصل
        window.saveClass = async function() {
            const classId = document.getElementById('classId').value;
            const className = document.getElementById('className').value.trim();
            const classCode = document.getElementById('classCode').value.trim();
            const classStage = document.getElementById('classStage').value;
            const academicYear = document.getElementById('academicYear').value.trim();
            const classStatus = document.getElementById('classStatus').value;
            
            const teacherIds = Array.from(document.querySelectorAll('.teacher-checkbox:checked')).map(cb => cb.value);
            
            if (!validateRequired(className)) {
                showToast('الرجاء إدخال اسم الفصل', 'warning');
                return;
            }
            
            if (!classStage) {
                showToast('الرجاء اختيار المرحلة الدراسية', 'warning');
                return;
            }
            
            const classData = {
                name: className,
                code: classCode,
                stageId: classStage,
                academicYear,
                teacherIds,
                status: classStatus
            };
            
            try {
                if (classId) {
                    await updateDocument('classes', classId, classData);
                    showToast('تم تحديث الفصل بنجاح', 'success');
                } else {
                    await createDocument('classes', classData);
                    showToast('تم إضافة الفصل بنجاح', 'success');
                }
                
                closeClassModal();
                await loadData();
                buildPage(await requireAuth(['admin', 'super_admin']));
                
            } catch (error) {
                console.error('Error saving class:', error);
                showToast('حدث خطأ أثناء حفظ البيانات', 'error');
            }
        };
        
        // حذف فصل
        window.deleteClass = async function(classId) {
            const cls = allClasses.find(c => c.id === classId);
            if (!cls) return;
            
            const confirmed = await confirmAction(
                `هل أنت متأكد من حذف الفصل "${cls.name}"؟`,
                'تأكيد الحذف'
            );
            
            if (!confirmed) return;
            
            try {
                await deleteDocument('classes', classId);
                showToast('تم حذف الفصل بنجاح', 'success');
                await loadData();
                buildPage(await requireAuth(['admin', 'super_admin']));
            } catch (error) {
                console.error('Error deleting class:', error);
                showToast('حدث خطأ أثناء الحذف', 'error');
            }
        };
        
        // بدء التحميل
        initClasses();
    </script>
</body>
</html>
