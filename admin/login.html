<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="auth-logo-icon">👨‍💼</div>
                <div class="auth-logo-text">
                    <h1 class="auth-logo-title">دخول الإدارة</h1>
                    <p class="auth-logo-subtitle">SchoolHub Pro</p>
                </div>
            </div>
            
            <!-- Title -->
            <h2 class="auth-title">لوحة تحكم الإدارة</h2>
            <p class="auth-subtitle">
                قم بتسجيل الدخول للوصول إلى لوحة الإدارة
            </p>
            
            <!-- Error Message -->
            <div id="errorMessage" class="auth-error" style="display: none;">
                <span class="auth-error-icon">⚠️</span>
                <span id="errorText"></span>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label required" for="email">البريد الإلكتروني</label>
                    <div class="input-group">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            placeholder="admin@example.com" 
                            required
                            autocomplete="email"
                            dir="ltr"
                        >
                        <span class="input-group-icon">📧</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required" for="password">كلمة المرور</label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="●●●●●●" 
                            required
                            autocomplete="current-password"
                            dir="ltr"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                        >
                        <span class="input-group-icon">🔒</span>
                    </div>
                    <div class="form-text">كلمة المرور 6 أرقام</div>
                </div>
                
                <div class="auth-options">
                    <label class="auth-remember">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="auth-forgot" id="forgotPassword">نسيت كلمة المرور؟</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    تسجيل الدخول
                </button>
            </form>
            
            <!-- Forgot Password Form -->
            <div id="forgotForm" style="display: none;">
                <h3 class="auth-title">استعادة كلمة المرور</h3>
                <p class="auth-subtitle">
                    أدخل البريد الإلكتروني وسنرسل لك رابط الاستعادة
                </p>
                
                <div class="form-group">
                    <label class="form-label required" for="resetEmail">البريد الإلكتروني</label>
                    <div class="input-group">
                        <input 
                            type="email" 
                            id="resetEmail" 
                            class="form-control" 
                            placeholder="admin@example.com" 
                            dir="ltr"
                        >
                        <span class="input-group-icon">📧</span>
                    </div>
                </div>
                
                <button class="btn btn-secondary btn-block" id="sendResetBtn">
                    إرسال رابط الاستعادة
                </button>
                
                <button class="btn btn-ghost btn-block mt-2" id="backToLogin">
                    العودة لتسجيل الدخول
                </button>
            </div>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p>العودة إلى <a href="../index.html">الصفحة الرئيسية</a></p>
                <p style="margin-top: 8px; font-size: 0.85rem; color: var(--muted);">
                    إنشاء وبرمجة أ/ اسماعيل عماد
                </p>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { loginAdmin, resetPassword, mapAuthError } from '../js/auth.js';
        import { showToast } from '../js/utils.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const forgotPassword = document.getElementById('forgotPassword');
        const forgotForm = document.getElementById('forgotForm');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const backToLogin = document.getElementById('backToLogin');
        const resetEmail = document.getElementById('resetEmail');
        
        // Show error message
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'flex';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        // Hide error message
        function hideError() {
            errorMessage.style.display = 'none';
        }
        
        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validation
            if (!email) {
                showError('الرجاء إدخال البريد الإلكتروني');
                return;
            }
            
            if (!password) {
                showError('الرجاء إدخال كلمة المرور');
                return;
            }
            
            if (!/^\d{6}$/.test(password)) {
                showError('كلمة المرور يجب أن تكون 6 أرقام');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner spinner-white"></span> جاري تسجيل الدخول...';
            
            try {
                const result = await loginAdmin(email, password, rememberMe.checked);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.textContent = 'تسجيل الدخول';
            }
        });
        
        // Handle forgot password
        forgotPassword.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            forgotForm.style.display = 'block';
        });
        
        // Handle back to login
        backToLogin.addEventListener('click', () => {
            forgotForm.style.display = 'none';
            loginForm.style.display = 'block';
        });
        
        // Handle send reset email
        sendResetBtn.addEventListener('click', async () => {
            const email = resetEmail.value.trim();
            
            if (!email) {
                showToast('الرجاء إدخال البريد الإلكتروني', 'warning');
                return;
            }
            
            sendResetBtn.disabled = true;
            sendResetBtn.innerHTML = '<span class="loading-spinner spinner-white"></span> جاري الإرسال...';
            
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('تم إرسال رابط الاستعادة إلى بريدك الإلكتروني', 'success');
                
                // العودة لتسجيل الدخول
                setTimeout(() => {
                    forgotForm.style.display = 'none';
                    loginForm.style.display = 'block';
                }, 2000);
            } catch (error) {
                showToast(mapAuthError(error), 'error');
            } finally {
                sendResetBtn.disabled = false;
                sendResetBtn.textContent = 'إرسال رابط الاستعادة';
            }
        });
        
        // Auto-focus email field
        emailInput.focus();
    </script>
</body>
</html>
