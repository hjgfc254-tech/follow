<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجلات النظام | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل السجلات...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocuments, getPaginatedDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { formatDateTime, showToast, escapeHtml } from '../js/utils.js';
        import { isAdmin, isSuperAdmin } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'logs';
        
        let allLogs = [];
        let currentProfile = null;
        let currentFilter = '';
        let lastVisible = null;
        let hasMore = false;
        
        // تهيئة الصفحة
        async function initLogs() {
            try {
                currentProfile = await requireAuth(['admin', 'super_admin']);
                if (!currentProfile) return;
                
                if (!isAdmin(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadLogs();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing logs:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل السجلات
        async function loadLogs() {
            try {
                const result = await getPaginatedDocuments('system_logs', {
                    orderByField: 'createdAt',
                    orderDirection: 'desc',
                    pageSize: 50
                });
                
                allLogs = result.documents;
                lastVisible = result.lastVisible;
                hasMore = result.hasMore;
            } catch (error) {
                console.error('Error loading logs:', error);
                
                // إذا فشل التحميل (قد لا توجد collection بعد)
                allLogs = [];
                hasMore = false;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'سجلات النظام');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">سجلات النظام</h1>
                                <p class="page-subtitle">سجل العمليات والإجراءات</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-outline" onclick="exportLogs()">
                                    📥 تصدير
                                </button>
                            </div>
                        </div>
                        
                        <!-- Filters -->
                        <div class="filters-container">
                            <select class="filter-select" id="actionFilter" onchange="filterLogs()">
                                <option value="">جميع الإجراءات</option>
                                <option value="CREATE_STUDENT">إضافة طالب</option>
                                <option value="UPDATE_STUDENT">تعديل طالب</option>
                                <option value="DELETE_STUDENT">حذف طالب</option>
                                <option value="CREATE_TEACHER">إضافة مدرس</option>
                                <option value="UPDATE_TEACHER">تعديل مدرس</option>
                                <option value="DELETE_TEACHER">حذف مدرس</option>
                                <option value="CREATE_EXPENSE">إضافة مصروف</option>
                                <option value="UPDATE_EXPENSE">تعديل مصروف</option>
                                <option value="DELETE_EXPENSE">حذف مصروف</option>
                                <option value="CREATE_ANNOUNCEMENT">إضافة إعلان</option>
                                <option value="DELETE_ANNOUNCEMENT">حذف إعلان</option>
                                <option value="SEND_MESSAGE">إرسال رسالة</option>
                                <option value="CREATE_EVENT">إضافة حدث</option>
                                <option value="LOGIN">تسجيل دخول</option>
                                <option value="LOGOUT">تسجيل خروج</option>
                            </select>
                        </div>
                        
                        <!-- Logs Timeline -->
                        <div class="timeline" id="logsTimeline">
                            ${renderLogsTimeline(allLogs)}
                        </div>
                        
                        ${hasMore ? `
                            <div class="text-center mt-3">
                                <button class="btn btn-outline" onclick="loadMoreLogs()">
                                    تحميل المزيد
                                </button>
                            </div>
                        ` : ''}
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض السجلات في Timeline
        function renderLogsTimeline(logs) {
            if (logs.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-title">لا توجد سجلات</div>
                        <div class="empty-state-text">لم يتم تسجيل أي عملية بعد</div>
                    </div>
                `;
            }
            
            return logs.map(log => {
                const logInfo = getLogInfo(log.action);
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot" style="background: ${logInfo.color};"></div>
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex justify-between items-center flex-wrap gap-2">
                                    <div class="d-flex items-center gap-2">
                                        <span style="font-size: 1.5rem;">${logInfo.icon}</span>
                                        <div>
                                            <h4 class="mb-0" style="font-size: 1rem;">${logInfo.label}</h4>
                                            <p class="text-muted mb-0" style="font-size: 0.85rem;">
                                                ${formatDateTime(log.createdAt)}
                                            </p>
                                        </div>
                                    </div>
                                    <span class="badge badge-royal">${escapeHtml(log.actorRole || '')}</span>
                                </div>
                                
                                ${log.targetType || log.targetId ? `
                                    <div class="mt-2 d-flex gap-2 flex-wrap">
                                        ${log.targetType ? `<span class="badge badge-info">${escapeHtml(log.targetType)}</span>` : ''}
                                        ${log.targetId ? `<span class="badge badge-muted">${escapeHtml(log.targetId)}</span>` : ''}
                                    </div>
                                ` : ''}
                                
                                ${log.details && Object.keys(log.details).length > 0 ? `
                                    <div class="mt-2">
                                        <details>
                                            <summary class="cursor-pointer text-muted" style="font-size: 0.85rem;">
                                                عرض التفاصيل
                                            </summary>
                                            <pre style="background: var(--page-bg); padding: 12px; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; margin-top: 8px;">${escapeHtml(JSON.stringify(log.details, null, 2))}</pre>
                                        </details>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // الحصول على معلومات السجل
        function getLogInfo(action) {
            const logMap = {
                'CREATE_STUDENT': { label: 'إضافة طالب', icon: '👨‍🎓', color: '#059669' },
                'UPDATE_STUDENT': { label: 'تعديل طالب', icon: '✏️', color: '#0284C7' },
                'DELETE_STUDENT': { label: 'حذف طالب', icon: '🗑️', color: '#DC2626' },
                'CREATE_TEACHER': { label: 'إضافة مدرس', icon: '👨‍🏫', color: '#059669' },
                'UPDATE_TEACHER': { label: 'تعديل مدرس', icon: '✏️', color: '#0284C7' },
                'DELETE_TEACHER': { label: 'حذف مدرس', icon: '🗑️', color: '#DC2626' },
                'CREATE_EXPENSE': { label: 'إضافة مصروف', icon: '💰', color: '#059669' },
                'UPDATE_EXPENSE': { label: 'تعديل مصروف', icon: '✏️', color: '#0284C7' },
                'DELETE_EXPENSE': { label: 'حذف مصروف', icon: '🗑️', color: '#DC2626' },
                'CREATE_ANNOUNCEMENT': { label: 'إضافة إعلان', icon: '📢', color: '#059669' },
                'DELETE_ANNOUNCEMENT': { label: 'حذف إعلان', icon: '🗑️', color: '#DC2626' },
                'SEND_MESSAGE': { label: 'إرسال رسالة', icon: '✉️', color: '#1E5FBB' },
                'CREATE_EVENT': { label: 'إضافة حدث', icon: '📅', color: '#059669' },
                'LOGIN': { label: 'تسجيل دخول', icon: '🔑', color: '#1E5FBB' },
                'LOGOUT': { label: 'تسجيل خروج', icon: '🚪', color: '#6B7280' }
            };
            
            return logMap[action] || { label: action, icon: '📋', color: '#6B7280' };
        }
        
        // فلترة السجلات
        window.filterLogs = function() {
            const actionFilter = document.getElementById('actionFilter').value;
            const logsTimeline = document.getElementById('logsTimeline');
            
            if (!actionFilter) {
                logsTimeline.innerHTML = renderLogsTimeline(allLogs);
                return;
            }
            
            const filteredLogs = allLogs.filter(log => log.action === actionFilter);
            logsTimeline.innerHTML = renderLogsTimeline(filteredLogs);
        };
        
        // تحميل المزيد
        window.loadMoreLogs = async function() {
            try {
                if (!lastVisible) return;
                
                const result = await getPaginatedDocuments('system_logs', {
                    orderByField: 'createdAt',
                    orderDirection: 'desc',
                    pageSize: 50,
                    lastDoc: lastVisible
                });
                
                allLogs = [...allLogs, ...result.documents];
                lastVisible = result.lastVisible;
                hasMore = result.hasMore;
                
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error loading more logs:', error);
                showToast('حدث خطأ أثناء تحميل المزيد', 'error');
            }
        };
        
        // تصدير السجلات
        window.exportLogs = function() {
            try {
                const logsData = allLogs.map(log => ({
                    action: log.action,
                    actorRole: log.actorRole,
                    targetType: log.targetType,
                    targetId: log.targetId,
                    createdAt: log.createdAt ? new Date(log.createdAt.toDate()).toISOString() : '',
                    details: log.details || {}
                }));
                
                const jsonStr = JSON.stringify(logsData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `system_logs_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                showToast('تم تصدير السجلات بنجاح', 'success');
            } catch (error) {
                console.error('Error exporting logs:', error);
                showToast('حدث خطأ أثناء التصدير', 'error');
            }
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initLogs();
    </script>
</body>
</html>
