<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>إعداد النظام | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="card-accent-bar"></div>
            
            <div class="card-body">
                <!-- الهيدر -->
                <div class="auth-header">
                    <div class="auth-brand">
                        <div class="auth-brand-icon">
                            <i class="fas fa-cog"></i>
                        </div>
                        <div class="auth-brand-text">
                            <h3>إعداد النظام</h3>
                            <span>الجيل الجديد</span>
                        </div>
                    </div>
                </div>
                
                <!-- العنوان -->
                <div>
                    <h2 class="auth-title">إنشاء أول مدير</h2>
                    <p class="auth-subtitle">هذه الصفحة تُستخدم مرة واحدة فقط لإنشاء حساب المدير العام</p>
                </div>
                
                <!-- رسالة -->
                <div id="messageBox" style="display: none;" class="auth-error">
                    <span id="messageText"></span>
                </div>
                
                <!-- نموذج -->
                <div class="form-group">
                    <label class="form-label">كود المدير (4 أرقام)</label>
                    <input type="text" class="form-control" id="adminCode" maxlength="4" inputmode="numeric" value="1000">
                </div>
                
                <div class="form-group">
                    <label class="form-label">كلمة المرور (6 أرقام)</label>
                    <input type="password" class="form-control" id="adminPassword" maxlength="6" inputmode="numeric" value="123456">
                </div>
                
                <div class="form-group">
                    <label class="form-label">اسم المدير</label>
                    <input type="text" class="form-control" id="adminName" value="مدير النظام">
                </div>
                
                <!-- زر الإنشاء -->
                <button class="auth-btn" id="setupBtn" onclick="createAdmin()">
                    <i class="fas fa-magic"></i>
                    إنشاء المدير العام
                </button>
                
                <!-- تذييل -->
                <div class="auth-footer">
                    <a href="index.html">العودة للرئيسية</a>
                    <span>إنشاء وبرمجة أ/ اسماعيل عماد</span>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { setDocument, getDocument } from './js/firestore.js';
        import { showToast, validateCode, validatePassword } from './js/utils.js';
        
        window.createAdmin = async function() {
            const code = document.getElementById('adminCode').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const name = document.getElementById('adminName').value.trim();
            
            if (!validateCode(code)) {
                showToast('الكود يجب أن يكون 4 أرقام', 'warning');
                return;
            }
            
            if (!validatePassword(password)) {
                showToast('كلمة المرور يجب أن تكون 6 أرقام', 'warning');
                return;
            }
            
            if (!name) {
                showToast('الرجاء إدخال اسم المدير', 'warning');
                return;
            }
            
            const btn = document.getElementById('setupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
            
            try {
                // التحقق من عدم وجود Admin مسبقًا
                const existingAdmin = await getDocument('users', code);
                
                if (existingAdmin) {
                    showToast('هذا الكود مستخدم بالفعل', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-magic"></i> إنشاء المدير العام';
                    return;
                }
                
                // إنشاء حساب Super Admin
                await setDocument('users', code, {
                    code,
                    password,
                    name,
                    role: 'super_admin',
                    status: 'active',
                    linkedId: code,
                    phone: ''
                });
                
                showToast('تم إنشاء المدير العام بنجاح! يمكنك تسجيل الدخول الآن', 'success');
                
                // إظهار رسالة نجاح
                document.getElementById('messageBox').style.display = 'flex';
                document.getElementById('messageText').textContent = `تم الإنشاء! الكود: ${code} - كلمة المرور: ${password}`;
                
                btn.innerHTML = '<i class="fas fa-check"></i> تم الإنشاء';
                
                // توجيه لصفحة الدخول بعد 2 ثانية
                setTimeout(() => {
                    window.location.href = 'admin/login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Error creating admin:', error);
                showToast('حدث خطأ أثناء الإنشاء: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> إنشاء المدير العام';
            }
        };
        
        // منع إدخال غير الأرقام
        document.getElementById('adminCode').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
        });
        
        document.getElementById('adminPassword').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
