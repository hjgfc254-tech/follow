<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلابي | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الطلاب...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocument, getAllDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, renderStatusBadge, handleLogout } from '../js/components.js';
        import { showToast, escapeHtml } from '../js/utils.js';
        import { isTeacher } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'students';
        
        let currentProfile = null;
        let teacherData = null;
        let allStudents = [];
        let filteredStudents = [];
        let allClasses = [];
        let allStages = [];
        
        // تهيئة الصفحة
        async function initStudents() {
            try {
                currentProfile = await requireAuth('teacher');
                if (!currentProfile) return;
                
                if (!isTeacher(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing students:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                // الحصول على بيانات المدرس
                teacherData = await getDocument('teachers', currentProfile.linkedId);
                
                if (!teacherData) {
                    teacherData = {
                        name: currentProfile.name || 'مدرس',
                        teacherCode: currentProfile.linkedId,
                        classIds: [],
                        stageIds: []
                    };
                }
                
                // تحميل جميع الطلاب
                allStudents = await getAllDocuments('students');
                
                // تحميل الفصول والمراحل
                allClasses = await getAllDocuments('classes');
                allStages = await getAllDocuments('stages');
                
                // تصفية الطلاب المسندين للمدرس
                const classIds = teacherData.classIds || [];
                
                if (classIds.length > 0) {
                    filteredStudents = allStudents.filter(s => 
                        classIds.includes(s.classId) && s.status === 'active'
                    );
                } else {
                    filteredStudents = [];
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'طلابي');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">طلابي</h1>
                                <p class="page-subtitle">إجمالي الطلاب المسندين: ${filteredStudents.length}</p>
                            </div>
                        </div>
                        
                        <!-- Search & Filters -->
                        <div class="filters-container">
                            <input 
                                type="text" 
                                class="search-input" 
                                placeholder="بحث بالاسم أو الكود..." 
                                id="searchInput"
                            >
                            <select class="filter-select" id="classFilter">
                                <option value="">جميع الفصول</option>
                                ${(teacherData.classIds || []).map(classId => {
                                    const cls = allClasses.find(c => c.id === classId);
                                    return cls ? `<option value="${cls.id}">${escapeHtml(cls.name)}</option>` : '';
                                }).join('')}
                            </select>
                        </div>
                        
                        <!-- Students Table -->
                        <div id="studentsTable">
                            ${renderStudentsTable(filteredStudents)}
                        </div>
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض جدول الطلاب
        function renderStudentsTable(students) {
            if (students.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">👨‍🎓</div>
                        <div class="empty-state-title">لا يوجد طلاب</div>
                        <div class="empty-state-text">لم يتم إسناد أي طلاب لك بعد</div>
                    </div>
                `;
            }
            
            return `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>الكود</th>
                                <th>الاسم</th>
                                <th>الفصل</th>
                                <th>المرحلة</th>
                                <th>ولي الأمر</th>
                                <th>هاتف ولي الأمر</th>
                                <th>الحالة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(student => {
                                const cls = allClasses.find(c => c.id === student.classId);
                                const stage = allStages.find(s => s.id === student.stageId);
                                
                                return `
                                    <tr>
                                        <td data-label="الكود">
                                            <span class="font-numbers">${escapeHtml(student.studentCode)}</span>
                                        </td>
                                        <td data-label="الاسم">${escapeHtml(student.name)}</td>
                                        <td data-label="الفصل">${escapeHtml(cls?.name || '—')}</td>
                                        <td data-label="المرحلة">${escapeHtml(stage?.name || '—')}</td>
                                        <td data-label="ولي الأمر">${escapeHtml(student.parentName || '—')}</td>
                                        <td data-label="هاتف ولي الأمر" class="font-numbers" dir="ltr">${escapeHtml(student.parentPhone || '—')}</td>
                                        <td data-label="الحالة">${renderStatusBadge(student.status)}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.addEventListener('input', debounceSearch);
            
            const classFilter = document.getElementById('classFilter');
            if (classFilter) classFilter.addEventListener('change', applyFilters);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        function debounceSearch() {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(() => applyFilters(), 300);
        }
        
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
            const classId = document.getElementById('classFilter')?.value || '';
            
            let filtered = allStudents.filter(s => {
                const classIds = teacherData.classIds || [];
                return classIds.includes(s.classId) && s.status === 'active';
            });
            
            if (searchTerm) {
                filtered = filtered.filter(student => {
                    const searchFields = [
                        student.name,
                        student.studentCode
                    ].join(' ').toLowerCase();
                    
                    return searchFields.includes(searchTerm);
                });
            }
            
            if (classId) {
                filtered = filtered.filter(student => student.classId === classId);
            }
            
            filteredStudents = filtered;
            
            const studentsTable = document.getElementById('studentsTable');
            if (studentsTable) {
                studentsTable.innerHTML = renderStudentsTable(filteredStudents);
            }
        }
        
        // بدء التحميل
        initStudents();
    </script>
</body>
</html>
