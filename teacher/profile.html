<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الملف الشخصي...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocument, getAllDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { showToast, escapeHtml } from '../js/utils.js';
        import { isTeacher } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'profile';
        
        let currentProfile = null;
        let teacherData = null;
        let teacherClasses = [];
        let teacherStages = [];
        
        // تهيئة الصفحة
        async function initProfile() {
            try {
                currentProfile = await requireAuth('teacher');
                if (!currentProfile) return;
                
                if (!isTeacher(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing profile:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                // الحصول على بيانات المدرس
                teacherData = await getDocument('teachers', currentProfile.linkedId);
                
                if (!teacherData) {
                    teacherData = {
                        name: currentProfile.name || 'مدرس',
                        teacherCode: currentProfile.linkedId,
                        email: currentProfile.email || '',
                        phone: currentProfile.phone || '',
                        classIds: [],
                        stageIds: [],
                        status: currentProfile.status || 'active',
                        notes: ''
                    };
                }
                
                // تحميل الفصول والمراحل
                const [classes, stages] = await Promise.all([
                    getAllDocuments('classes'),
                    getAllDocuments('stages')
                ]);
                
                teacherClasses = classes.filter(c => 
                    (teacherData.classIds || []).includes(c.id)
                );
                
                teacherStages = stages.filter(s => 
                    (teacherData.stageIds || []).includes(s.id)
                );
                
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'ملفي الشخصي');
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">ملفي الشخصي</h1>
                                <p class="page-subtitle">بياناتك الشخصية</p>
                            </div>
                        </div>
                        
                        <!-- Profile Header -->
                        <div class="profile-header">
                            <div class="profile-avatar">
                                ${escapeHtml((teacherData.name || 'م').charAt(0))}
                            </div>
                            <h2 class="profile-name">${escapeHtml(teacherData.name)}</h2>
                            <p class="profile-role">مدرس</p>
                        </div>
                        
                        <!-- Profile Details -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">البيانات الشخصية</h3>
                            </div>
                            <div class="card-body">
                                <div class="profile-details">
                                    <div class="profile-detail-item">
                                        <div class="profile-detail-label">كود المدرس</div>
                                        <div class="profile-detail-value font-numbers">${escapeHtml(teacherData.teacherCode || currentProfile.linkedId)}</div>
                                    </div>
                                    
                                    <div class="profile-detail-item">
                                        <div class="profile-detail-label">البريد الإلكتروني</div>
                                        <div class="profile-detail-value" dir="ltr">${escapeHtml(teacherData.email || currentProfile.email || '—')}</div>
                                    </div>
                                    
                                    <div class="profile-detail-item">
                                        <div class="profile-detail-label">رقم الهاتف</div>
                                        <div class="profile-detail-value font-numbers" dir="ltr">${escapeHtml(teacherData.phone || '—')}</div>
                                    </div>
                                    
                                    <div class="profile-detail-item">
                                        <div class="profile-detail-label">الحالة</div>
                                        <div class="profile-detail-value">
                                            <span class="badge badge-success">نشط</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Classes & Stages -->
                        <div class="dashboard-grid mt-2">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">الفصول المسندة</h3>
                                </div>
                                <div class="card-body">
                                    ${teacherClasses.length > 0 ? teacherClasses.map(cls => `
                                        <div class="list-item">
                                            <div class="list-item-icon" style="background: var(--royal-light);">🏫</div>
                                            <div class="list-item-content">
                                                <p class="list-item-title">${escapeHtml(cls.name)}</p>
                                                <p class="list-item-subtitle">${escapeHtml(cls.academicYear || '')}</p>
                                            </div>
                                        </div>
                                    `).join('') : `
                                        <div class="empty-state">
                                            <div class="empty-state-icon">🏫</div>
                                            <div class="empty-state-title">لا توجد فصول</div>
                                        </div>
                                    `}
                                </div>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">المراحل</h3>
                                </div>
                                <div class="card-body">
                                    ${teacherStages.length > 0 ? teacherStages.map(stage => `
                                        <div class="list-item">
                                            <div class="list-item-icon" style="background: var(--success-bg);">📚</div>
                                            <div class="list-item-content">
                                                <p class="list-item-title">${escapeHtml(stage.name)}</p>
                                            </div>
                                        </div>
                                    `).join('') : `
                                        <div class="empty-state">
                                            <div class="empty-state-icon">📚</div>
                                            <div class="empty-state-title">لا توجد مراحل</div>
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                        
                        ${teacherData.notes ? `
                            <div class="card mt-2">
                                <div class="card-header">
                                    <h3 class="card-title">ملاحظات</h3>
                                </div>
                                <div class="card-body">
                                    <p>${escapeHtml(teacherData.notes)}</p>
                                </div>
                            </div>
                        ` : ''}
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initProfile();
    </script>
</body>
</html>
