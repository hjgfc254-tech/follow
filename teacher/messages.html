<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الرسائل...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { 
            getDocument, 
            getDocuments, 
            getAllDocuments,
            createDocument,
            updateDocument,
            deleteDocument
        } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { formatDateTime, showToast, escapeHtml, confirmAction, validateRequired } from '../js/utils.js';
        import { isTeacher } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'messages';
        
        let currentProfile = null;
        let teacherData = null;
        let allMessages = [];
        let teacherStudents = [];
        let currentView = 'inbox';
        
        // تهيئة الصفحة
        async function initMessages() {
            try {
                currentProfile = await requireAuth('teacher');
                if (!currentProfile) return;
                
                if (!isTeacher(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing messages:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                // الحصول على بيانات المدرس
                teacherData = await getDocument('teachers', currentProfile.linkedId);
                
                if (!teacherData) {
                    teacherData = { classIds: [], stageIds: [] };
                }
                
                // تحميل رسائل المدرس
                const [received, sent] = await Promise.all([
                    getDocuments('messages', [
                        { field: 'receiverId', operator: '==', value: currentProfile.uid }
                    ], { orderBy: 'createdAt', orderDirection: 'desc' }),
                    getDocuments('messages', [
                        { field: 'senderId', operator: '==', value: currentProfile.uid }
                    ], { orderBy: 'createdAt', orderDirection: 'desc' })
                ]);
                
                allMessages = [...received, ...sent];
                
                // تحميل الطلاب المسندين
                const allStudents = await getAllDocuments('students');
                const classIds = teacherData.classIds || [];
                teacherStudents = allStudents.filter(s => 
                    classIds.includes(s.classId) && s.status === 'active' && s.userId
                );
                
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الرسائل');
            
            const inboxMessages = allMessages.filter(m => m.receiverId === currentProfile.uid);
            const sentMessages = allMessages.filter(m => m.senderId === currentProfile.uid);
            const unreadCount = inboxMessages.filter(m => !m.isRead).length;
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الرسائل</h1>
                                <p class="page-subtitle">إرسال واستقبال الرسائل</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" onclick="showCompose()">
                                    + رسالة جديدة
                                </button>
                            </div>
                        </div>
                        
                        <!-- Tabs -->
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn ${currentView === 'inbox' ? 'btn-primary' : 'btn-outline'}" onclick="showInbox()">
                                الوارد (${unreadCount})
                            </button>
                            <button class="btn ${currentView === 'sent' ? 'btn-primary' : 'btn-outline'}" onclick="showSent()">
                                المرسل (${sentMessages.length})
                            </button>
                        </div>
                        
                        <!-- Messages Content -->
                        <div id="messagesContent">
                            ${currentView === 'inbox' ? renderInbox(inboxMessages) : currentView === 'sent' ? renderSent(sentMessages) : renderCompose()}
                        </div>
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض الوارد
        function renderInbox(messages) {
            if (messages.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📥</div>
                        <div class="empty-state-title">لا توجد رسائل واردة</div>
                    </div>
                `;
            }
            
            return messages.map(message => `
                <div class="message-item ${!message.isRead ? 'unread' : ''}" onclick="viewMessage('${message.id}')">
                    <div class="avatar ${!message.isRead ? 'avatar-red' : 'avatar-blue'}">
                        ${escapeHtml((message.senderRole || 'م').charAt(0))}
                    </div>
                    <div class="list-item-content">
                        <div class="d-flex justify-between items-center">
                            <p class="message-sender">${message.senderRole === 'admin' ? 'الإدارة' : message.senderRole === 'teacher' ? 'مدرس' : 'طالب'}</p>
                            ${!message.isRead ? '<span class="message-unread-badge"></span>' : ''}
                        </div>
                        <p class="message-subject">${escapeHtml(message.subject)}</p>
                        <p class="message-date">${formatDateTime(message.createdAt)}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // عرض المرسل
        function renderSent(messages) {
            if (messages.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📤</div>
                        <div class="empty-state-title">لا توجد رسائل مرسلة</div>
                    </div>
                `;
            }
            
            return messages.map(message => `
                <div class="message-item" onclick="viewMessage('${message.id}')">
                    <div class="avatar avatar-green">
                        ${escapeHtml((message.receiverRole || 'م').charAt(0))}
                    </div>
                    <div class="list-item-content">
                        <p class="message-sender">إلى: ${message.receiverRole === 'admin' ? 'الإدارة' : message.receiverRole === 'teacher' ? 'مدرس' : 'طالب'}</p>
                        <p class="message-subject">${escapeHtml(message.subject)}</p>
                        <p class="message-date">${formatDateTime(message.createdAt)}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // عرض نموذج الإرسال
        function renderCompose() {
            return `
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">رسالة جديدة</h3>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label required">إرسال إلى</label>
                            <select class="form-control" id="receiverType">
                                <option value="">اختر المستلم</option>
                                <option value="admin">الإدارة</option>
                                <option value="student">طالب محدد</option>
                                <option value="all_students">جميع طلابي</option>
                            </select>
                        </div>
                        
                        <div class="form-group" id="studentField" style="display: none;">
                            <label class="form-label">الطالب</label>
                            <select class="form-control" id="receiverStudent">
                                <option value="">اختر الطالب</option>
                                ${teacherStudents.map(student => `
                                    <option value="${student.userId}">
                                        ${escapeHtml(student.name)} (${escapeHtml(student.studentCode)})
                                    </option>
                                `).join('')}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">الموضوع</label>
                            <input type="text" class="form-control" id="messageSubject" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">محتوى الرسالة</label>
                            <textarea class="form-control" id="messageContent" rows="5" required></textarea>
                        </div>
                        
                        <div class="d-flex gap-2 justify-end">
                            <button class="btn btn-secondary" onclick="showInbox()">إلغاء</button>
                            <button class="btn btn-primary" onclick="sendMessage()">إرسال</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // تبديل حقول المستلم
        window.toggleReceiverFields = function() {
            const receiverType = document.getElementById('receiverType').value;
            const studentField = document.getElementById('studentField');
            
            if (receiverType === 'student') {
                studentField.style.display = 'block';
            } else {
                studentField.style.display = 'none';
            }
        };
        
        // عرض الوارد
        window.showInbox = function() {
            currentView = 'inbox';
            buildPage(currentProfile);
        };
        
        // عرض المرسل
        window.showSent = function() {
            currentView = 'sent';
            buildPage(currentProfile);
        };
        
        // عرض نموذج الإرسال
        window.showCompose = function() {
            currentView = 'compose';
            buildPage(currentProfile);
        };
        
        // عرض رسالة
        window.viewMessage = async function(messageId) {
            const message = allMessages.find(m => m.id === messageId);
            if (!message) return;
            
            // تحديث حالة القراءة
            if (!message.isRead && message.receiverId === currentProfile.uid) {
                await updateDocument('messages', messageId, { isRead: true, readAt: new Date() });
                message.isRead = true;
            }
            
            const senderLabel = message.senderRole === 'admin' ? 'الإدارة' : message.senderRole === 'teacher' ? 'مدرس' : 'طالب';
            const receiverLabel = message.receiverRole === 'admin' ? 'الإدارة' : message.receiverRole === 'teacher' ? 'مدرس' : 'طالب';
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="modal" style="max-width: 500px;">
                    <div class="modal-header">
                        <h3 class="modal-title">${escapeHtml(message.subject)}</h3>
                        <button class="modal-close">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-between mb-3">
                            <div>
                                <p class="text-muted mb-1" style="font-size: 0.85rem;">من: ${senderLabel}</p>
                                <p class="text-muted mb-1" style="font-size: 0.85rem;">إلى: ${receiverLabel}</p>
                            </div>
                            <span class="text-muted" style="font-size: 0.85rem;">${formatDateTime(message.createdAt)}</span>
                        </div>
                        <div style="background: var(--page-bg); padding: 16px; border-radius: 8px;">
                            <p style="white-space: pre-wrap;">${escapeHtml(message.content)}</p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary modal-close-btn">إغلاق</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
            
            const closeModal = () => {
                modal.remove();
                document.body.style.overflow = '';
            };
            
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            modal.querySelector('.modal-close-btn').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        };
        
        // إرسال رسالة
        window.sendMessage = async function() {
            const receiverType = document.getElementById('receiverType').value;
            const subject = document.getElementById('messageSubject').value.trim();
            const content = document.getElementById('messageContent').value.trim();
            
            if (!receiverType) {
                showToast('الرجاء اختيار المستلم', 'warning');
                return;
            }
            
            if (!validateRequired(subject)) {
                showToast('الرجاء إدخال موضوع الرسالة', 'warning');
                return;
            }
            
            if (!validateRequired(content)) {
                showToast('الرجاء إدخال محتوى الرسالة', 'warning');
                return;
            }
            
            try {
                if (receiverType === 'admin') {
                    // إرسال للإدارة (أول admin موجود)
                    const admins = await getDocuments('users', [
                        { field: 'role', operator: '==', value: 'admin' }
                    ]);
                    
                    if (admins.length === 0) {
                        showToast('لا يوجد مشرف للإرسال إليه', 'warning');
                        return;
                    }
                    
                    await createDocument('messages', {
                        senderId: currentProfile.uid,
                        senderRole: 'teacher',
                        receiverId: admins[0].uid,
                        receiverRole: 'admin',
                        subject,
                        content,
                        isRead: false,
                        readAt: null
                    });
                    
                } else if (receiverType === 'student') {
                    const studentId = document.getElementById('receiverStudent').value;
                    
                    if (!studentId) {
                        showToast('الرجاء اختيار الطالب', 'warning');
                        return;
                    }
                    
                    await createDocument('messages', {
                        senderId: currentProfile.uid,
                        senderRole: 'teacher',
                        receiverId: studentId,
                        receiverRole: 'student',
                        subject,
                        content,
                        isRead: false,
                        readAt: null
                    });
                    
                } else if (receiverType === 'all_students') {
                    // إرسال لجميع الطلاب المسندين
                    for (const student of teacherStudents) {
                        if (student.userId) {
                            await createDocument('messages', {
                                senderId: currentProfile.uid,
                                senderRole: 'teacher',
                                receiverId: student.userId,
                                receiverRole: 'student',
                                subject,
                                content,
                                isRead: false,
                                readAt: null
                            });
                        }
                    }
                }
                
                showToast('تم إرسال الرسالة بنجاح', 'success');
                await loadData();
                showInbox();
                
            } catch (error) {
                console.error('Error sending message:', error);
                showToast('حدث خطأ أثناء إرسال الرسالة', 'error');
            }
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
            
            const receiverType = document.getElementById('receiverType');
            if (receiverType) receiverType.addEventListener('change', toggleReceiverFields);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initMessages();
    </script>
</body>
</html>
