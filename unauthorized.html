<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير مصرح | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <style>
        .unauthorized-icon {
            font-size: 6rem;
            margin-bottom: var(--spacing-lg);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .unauthorized-code {
            font-family: var(--font-numbers);
            font-size: 8rem;
            font-weight: 900;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: var(--spacing-md);
            text-shadow: 4px 4px 0 rgba(201, 42, 42, 0.1);
        }
        
        .unauthorized-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xl);
            line-height: 1.8;
        }
        
        .unauthorized-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- Error Code -->
            <div class="text-center">
                <div class="unauthorized-code">403</div>
            </div>
            
            <!-- Icon -->
            <div class="text-center">
                <div class="unauthorized-icon">🔒</div>
            </div>
            
            <!-- Title -->
            <h1 class="auth-title">عذرًا، ليس لديك صلاحية للوصول</h1>
            
            <!-- Message -->
            <p class="unauthorized-message text-center">
                ليس لديك الصلاحية للوصول إلى هذه الصفحة.<br>
                إذا كنت تعتقد أن هذا خطأ، يرجى التواصل مع إدارة المدرسة.
            </p>
            
            <!-- Actions -->
            <div class="unauthorized-actions">
                <button class="btn btn-primary" onclick="goBack()">
                    ← العودة للصفحة السابقة
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 الصفحة الرئيسية
                </button>
                <button class="btn btn-outline" onclick="logoutUser()">
                    تسجيل الخروج
                </button>
            </div>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p style="margin-top: 8px; font-size: 0.85rem; color: var(--muted);">
                    إنشاء وبرمجة أ/ اسماعيل عماد
                </p>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script type="module">
        import { auth } from './js/firebase.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        
        // العودة للصفحة السابقة
        window.goBack = function() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        };
        
        // الذهاب للصفحة الرئيسية
        window.goHome = function() {
            window.location.href = 'index.html';
        };
        
        // تسجيل الخروج
        window.logoutUser = async function() {
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
