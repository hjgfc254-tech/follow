<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء البيانات | الجيل الجديد</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px;">
            <div class="card-accent-bar"></div>
            
            <div class="card-body">
                <div class="auth-header">
                    <div class="auth-brand">
                        <div class="auth-brand-icon">
                            <i class="fas fa-database"></i>
                        </div>
                        <div class="auth-brand-text">
                            <h3>إنشاء البيانات</h3>
                            <span>جميع الـ Collections</span>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h2 class="auth-title">تهيئة قاعدة البيانات</h2>
                    <p class="auth-subtitle">اضغط الزر لإنشاء جميع الـ Collections دفعة واحدة</p>
                </div>
                
                <div id="statusBox" style="display: none; padding: 16px; border-radius: 12px; margin-bottom: 16px;">
                    <div id="statusText" style="font-size: 14px; font-weight: 600;"></div>
                </div>
                
                <button class="auth-btn" onclick="createAllCollections()" id="btnCreate">
                    <i class="fas fa-rocket"></i>
                    إنشاء جميع الـ Collections
                </button>
                
                <div style="background: var(--soft); border-radius: 12px; padding: 16px; max-height: 300px; overflow-y: auto; font-size: 12px;">
                    <p class="text-muted mb-2">سجل العمليات:</p>
                    <div id="logContent"></div>
                </div>
                
                <div class="auth-footer">
                    <a href="index.html">العودة للرئيسية</a>
                    <span>إنشاء وبرمجة أ/ اسماعيل عماد</span>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAtjQ3-KjPweYcSDPYB63MZNUeIDIUjusM",
            authDomain: "follo-3f26c.firebaseapp.com",
            projectId: "follo-3f26c",
            storageBucket: "follo-3f26c.firebasestorage.app",
            messagingSenderId: "537390194014",
            appId: "1:537390194014:web:8e4fe0d6f861a9ea4543cf"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        function log(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const colors = {
                info: '#1E5FBB',
                success: '#059669',
                error: '#DC2626'
            };
            
            const line = document.createElement('p');
            line.style.color = colors[type] || colors.info;
            line.style.marginBottom = '4px';
            line.textContent = message;
            logContent.appendChild(line);
        }
        
        function showStatus(message, type = 'info') {
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            
            const colors = {
                info: { bg: '#EBF3FF', color: '#1E5FBB' },
                success: { bg: '#ECFDF5', color: '#059669' },
                error: { bg: '#FEF2F2', color: '#DC2626' }
            };
            
            statusBox.style.display = 'block';
            statusBox.style.background = colors[type].bg;
            statusText.style.color = colors[type].color;
            statusText.textContent = message;
        }
        
        window.createAllCollections = async function() {
            const btn = document.getElementById('btnCreate');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
            
            const collections = [
                'students',
                'teachers',
                'stages',
                'classes',
                'announcements',
                'messages',
                'events',
                'settings',
                'system_logs',
                'notifications'
            ];
            
            try {
                for (const collectionName of collections) {
                    log(`جاري إنشاء ${collectionName}...`, 'info');
                    
                    const docRef = doc(db, collectionName, 'placeholder');
                    await setDoc(docRef, {
                        _placeholder: true,
                        createdAt: new Date()
                    });
                    
                    log(`✅ تم إنشاء ${collectionName}`, 'success');
                }
                
                showStatus('تم إنشاء جميع الـ Collections بنجاح!', 'success');
                log('🎉 اكتمل الإنشاء!', 'success');
                
                btn.innerHTML = '<i class="fas fa-check"></i> تم الإنشاء';
                
            } catch (error) {
                console.error('Error:', error);
                log(`❌ خطأ: ${error.message}`, 'error');
                showStatus('حدث خطأ: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket"></i> إعادة المحاولة';
            }
        };
    </script>
</body>
</html>
