<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصروفاتي | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل المصروفات...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { formatDate, formatCurrency, showToast, escapeHtml } from '../js/utils.js';
        import { isStudent } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'expenses';
        
        let currentProfile = null;
        let studentExpenses = [];
        
        // تهيئة الصفحة
        async function initExpenses() {
            try {
                currentProfile = await requireAuth('student');
                if (!currentProfile) return;
                
                if (!isStudent(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing expenses:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                studentExpenses = await getDocuments('expenses', [
                    { field: 'studentId', operator: '==', value: currentProfile.linkedId }
                ], { orderBy: 'createdAt', orderDirection: 'desc' });
                
            } catch (error) {
                console.error('Error loading expenses:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'مصروفاتي');
            
            // حساب الإحصائيات
            const totalAmount = studentExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
            const totalPaid = studentExpenses.reduce((sum, e) => sum + (Number(e.paidAmount) || 0), 0);
            const totalRemaining = totalAmount - totalPaid;
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">مصروفاتي</h1>
                                <p class="page-subtitle">جميع المصروفات الدراسية</p>
                            </div>
                        </div>
                        
                        <!-- Statistics -->
                        <div class="stats-grid stats-grid-3 mb-3">
                            <div class="stat-card">
                                <div class="stat-icon blue">💰</div>
                                <div class="stat-label">إجمالي المصروفات</div>
                                <div class="stat-value">${formatCurrency(totalAmount)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon green">✅</div>
                                <div class="stat-label">المدفوع</div>
                                <div class="stat-value">${formatCurrency(totalPaid)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon red">⏳</div>
                                <div class="stat-label">المتبقي</div>
                                <div class="stat-value">${formatCurrency(totalRemaining)}</div>
                            </div>
                        </div>
                        
                        <!-- Expenses List -->
                        <div id="expensesList">
                            ${renderExpensesList(studentExpenses)}
                        </div>
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض قائمة المصروفات
        function renderExpensesList(expenses) {
            if (expenses.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">💰</div>
                        <div class="empty-state-title">لا توجد مصروفات</div>
                        <div class="empty-state-text">لم يتم إضافة أي مصروفات لك بعد</div>
                    </div>
                `;
            }
            
            return expenses.map(expense => {
                const remaining = (Number(expense.amount) || 0) - (Number(expense.paidAmount) || 0);
                const paidPercentage = expense.amount > 0 ? 
                    Math.round(((Number(expense.paidAmount) || 0) / Number(expense.amount)) * 100) : 0;
                
                let statusBadge = '';
                if (expense.status === 'cancelled') {
                    statusBadge = '<span class="badge badge-muted">ملغي</span>';
                } else if (remaining === 0) {
                    statusBadge = '<span class="badge badge-success">مدفوع</span>';
                } else if (paidPercentage > 0) {
                    statusBadge = '<span class="badge badge-warning">جزئي</span>';
                } else {
                    statusBadge = '<span class="badge badge-error">غير مدفوع</span>';
                }
                
                return `
                    <div class="expense-card">
                        <div class="expense-header">
                            <div class="d-flex items-center gap-2">
                                <h3 class="expense-title mb-0">${escapeHtml(expense.title)}</h3>
                                ${statusBadge}
                            </div>
                            <span class="expense-amount">${formatCurrency(expense.amount)}</span>
                        </div>
                        
                        ${expense.description ? `
                            <p class="text-muted mb-3" style="font-size: 0.9rem;">${escapeHtml(expense.description)}</p>
                        ` : ''}
                        
                        <div class="expense-details">
                            <div class="expense-detail-item">
                                <div class="expense-detail-label">المدفوع</div>
                                <div class="expense-detail-value font-numbers">${formatCurrency(expense.paidAmount)}</div>
                            </div>
                            <div class="expense-detail-item">
                                <div class="expense-detail-label">المتبقي</div>
                                <div class="expense-detail-value font-numbers">${formatCurrency(remaining)}</div>
                            </div>
                            <div class="expense-detail-item">
                                <div class="expense-detail-label">تاريخ الاستحقاق</div>
                                <div class="expense-detail-value">${expense.dueDate ? formatDate(expense.dueDate) : '—'}</div>
                            </div>
                        </div>
                        
                        <div class="progress mt-2">
                            <div class="progress-bar ${paidPercentage === 100 ? 'progress-bar-success' : paidPercentage > 0 ? 'progress-bar-warning' : 'progress-bar-error'}" 
                                 style="width: ${paidPercentage}%;"></div>
                        </div>
                        <div class="d-flex justify-between mt-1">
                            <span class="text-muted" style="font-size: 0.8rem;">نسبة الدفع</span>
                            <span class="font-numbers" style="font-size: 0.9rem; font-weight: 600;">${paidPercentage}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initExpenses();
    </script>
</body>
</html>
