<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأحداث | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الأحداث...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocuments } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { formatDate, getDayName, showToast, escapeHtml, getTodayDate } from '../js/utils.js';
        import { isStudent } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'events';
        
        let currentProfile = null;
        let allEvents = [];
        let currentFilter = 'upcoming'; // upcoming, past, all
        
        // تهيئة الصفحة
        async function initEvents() {
            try {
                currentProfile = await requireAuth('student');
                if (!currentProfile) return;
                
                if (!isStudent(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing events:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                allEvents = await getDocuments('events', [
                    { field: 'status', operator: '==', value: 'published' }
                ], { orderBy: 'date', orderDirection: 'desc' });
                
            } catch (error) {
                console.error('Error loading events:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الأحداث');
            
            const filteredEvents = getFilteredEvents();
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الأحداث المدرسية</h1>
                                <p class="page-subtitle">الأحداث والأخبار</p>
                            </div>
                        </div>
                        
                        <!-- Filters -->
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn ${currentFilter === 'upcoming' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('upcoming')">
                                القادمة
                            </button>
                            <button class="btn ${currentFilter === 'past' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('past')">
                                السابقة
                            </button>
                            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-outline'}" onclick="filterEvents('all')">
                                الكل
                            </button>
                        </div>
                        
                        <!-- Events Timeline -->
                        <div class="timeline" id="eventsTimeline">
                            ${renderEvents(filteredEvents)}
                        </div>
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // الحصول على الأحداث المفلترة
        function getFilteredEvents() {
            const today = getTodayDate();
            
            switch (currentFilter) {
                case 'upcoming':
                    return allEvents.filter(e => e.date >= today);
                case 'past':
                    return allEvents.filter(e => e.date < today);
                case 'all':
                default:
                    return allEvents;
            }
        }
        
        // عرض الأحداث
        function renderEvents(events) {
            if (events.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-title">لا توجد أحداث</div>
                        <div class="empty-state-text">لم يتم إضافة أي حدث بعد</div>
                    </div>
                `;
            }
            
            return events.map(event => {
                const eventDate = new Date(event.date);
                const day = String(eventDate.getDate()).padStart(2, '0');
                const month = eventDate.toLocaleDateString('ar-EG', { month: 'short' });
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="event-card">
                            <div class="event-date-box">
                                <span class="event-date-day">${day}</span>
                                <span class="event-date-month">${month}</span>
                            </div>
                            <div class="event-details">
                                <h3 class="event-title">${escapeHtml(event.title)}</h3>
                                
                                ${event.description ? `<p class="event-info">${escapeHtml(event.description)}</p>` : ''}
                                
                                <div class="d-flex items-center gap-2 flex-wrap">
                                    <span class="event-info mb-0">📅 ${formatDate(event.date)} (${getDayName(event.date)})</span>
                                    ${event.location ? `<span class="event-info mb-0">📍 ${escapeHtml(event.location)}</span>` : ''}
                                    ${event.startTime ? `<span class="event-info mb-0">🕐 ${event.startTime}${event.endTime ? ' - ' + event.endTime : ''}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // فلترة الأحداث
        window.filterEvents = function(filter) {
            currentFilter = filter;
            buildPage(currentProfile);
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initEvents();
    </script>
</body>
</html>
