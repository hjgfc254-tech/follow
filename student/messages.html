<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل | SchoolHub Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="app">
        <div class="loading-container" id="loadingContainer">
            <div>
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل الرسائل...</div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { auth } from '../js/firebase.js';
        import { requireAuth } from '../js/auth.js';
        import { getDocuments, updateDocument } from '../js/firestore.js';
        import { renderSidebar, renderHeader, handleLogout } from '../js/components.js';
        import { formatDateTime, showToast, escapeHtml } from '../js/utils.js';
        import { isStudent } from '../js/permissions.js';
        
        const app = document.getElementById('app');
        const currentPage = 'messages';
        
        let currentProfile = null;
        let studentMessages = [];
        
        // تهيئة الصفحة
        async function initMessages() {
            try {
                currentProfile = await requireAuth('student');
                if (!currentProfile) return;
                
                if (!isStudent(currentProfile)) {
                    window.location.href = '../unauthorized.html';
                    return;
                }
                
                await loadData();
                buildPage(currentProfile);
                
            } catch (error) {
                console.error('Error initializing messages:', error);
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">⚠️</div>
                        <div class="empty-state-title">حدث خطأ أثناء التحميل</div>
                        <button class="btn btn-primary mt-2" onclick="location.reload()">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        // تحميل البيانات
        async function loadData() {
            try {
                studentMessages = await getDocuments('messages', [
                    { field: 'receiverId', operator: '==', value: currentProfile.uid }
                ], { orderBy: 'createdAt', orderDirection: 'desc' });
                
            } catch (error) {
                console.error('Error loading messages:', error);
                throw error;
            }
        }
        
        // بناء الصفحة
        function buildPage(profile) {
            const sidebar = renderSidebar(profile, currentPage);
            const header = renderHeader(profile, 'الرسائل');
            
            const unreadCount = studentMessages.filter(m => !m.isRead).length;
            
            app.innerHTML = `
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
                <aside class="sidebar" id="sidebarContainer">
                    ${sidebar}
                </aside>
                <div class="main-content">
                    <header class="header" id="headerContainer">
                        ${header}
                    </header>
                    <main class="main-content-inner">
                        <!-- Page Header -->
                        <div class="page-header">
                            <div>
                                <h1 class="page-title">الرسائل</h1>
                                <p class="page-subtitle">الرسائل الواردة (${unreadCount} غير مقروءة)</p>
                            </div>
                        </div>
                        
                        <!-- Messages List -->
                        <div id="messagesList">
                            ${renderMessages(studentMessages)}
                        </div>
                    </main>
                </div>
            `;
            
            setupEventListeners();
        }
        
        // عرض الرسائل
        function renderMessages(messages) {
            if (messages.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">📥</div>
                        <div class="empty-state-title">لا توجد رسائل</div>
                        <div class="empty-state-text">لم تصلك أي رسائل بعد</div>
                    </div>
                `;
            }
            
            return messages.map(message => {
                const senderLabel = message.senderRole === 'admin' ? 'الإدارة' : 
                                   message.senderRole === 'teacher' ? 'مدرس' : 'مرسل';
                
                return `
                    <div class="message-item ${!message.isRead ? 'unread' : ''}" onclick="viewMessage('${message.id}')">
                        <div class="avatar ${!message.isRead ? 'avatar-red' : 'avatar-blue'}">
                            ${escapeHtml(senderLabel.charAt(0))}
                        </div>
                        <div class="list-item-content">
                            <div class="d-flex justify-between items-center">
                                <p class="message-sender">${escapeHtml(senderLabel)}</p>
                                ${!message.isRead ? '<span class="message-unread-badge"></span>' : ''}
                            </div>
                            <p class="message-subject">${escapeHtml(message.subject)}</p>
                            <p class="message-date">${formatDateTime(message.createdAt)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // عرض رسالة
        window.viewMessage = async function(messageId) {
            const message = studentMessages.find(m => m.id === messageId);
            if (!message) return;
            
            // تحديث حالة القراءة
            if (!message.isRead) {
                await updateDocument('messages', messageId, { isRead: true, readAt: new Date() });
                message.isRead = true;
                buildPage(currentProfile);
            }
            
            const senderLabel = message.senderRole === 'admin' ? 'الإدارة' : 
                               message.senderRole === 'teacher' ? 'مدرس' : 'مرسل';
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="modal" style="max-width: 500px;">
                    <div class="modal-header">
                        <h3 class="modal-title">${escapeHtml(message.subject)}</h3>
                        <button class="modal-close">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-between mb-3">
                            <div>
                                <p class="text-muted mb-1" style="font-size: 0.85rem;">من: ${escapeHtml(senderLabel)}</p>
                            </div>
                            <span class="text-muted" style="font-size: 0.85rem;">${formatDateTime(message.createdAt)}</span>
                        </div>
                        <div style="background: var(--page-bg); padding: 16px; border-radius: 8px;">
                            <p style="white-space: pre-wrap;">${escapeHtml(message.content)}</p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary modal-close-btn">إغلاق</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
            
            const closeModal = () => {
                modal.remove();
                document.body.style.overflow = '';
            };
            
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            modal.querySelector('.modal-close-btn').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        };
        
        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
            
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
        }
        
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }
        
        // بدء التحميل
        initMessages();
    </script>
</body>
</html>
