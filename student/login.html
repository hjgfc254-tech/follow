<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>دخول الطلاب | الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="card-accent-bar"></div>
            
            <div class="card-body">
                <!-- الهيدر -->
                <div class="auth-header">
                    <div class="auth-brand">
                        <div class="auth-brand-icon">
                            <i class="fas fa-user-graduate"></i>
                        </div>
                        <div class="auth-brand-text">
                            <h3>دخول الطلاب</h3>
                            <span>الجيل الجديد</span>
                        </div>
                    </div>
                </div>
                
                <!-- العنوان -->
                <div>
                    <h2 class="auth-title">بوابة الطلاب</h2>
                    <p class="auth-subtitle">قم بتسجيل الدخول للمتابعة</p>
                </div>
                
                <!-- رسالة الخطأ -->
                <div id="errorMessage" class="auth-error" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>
                
                <!-- نموذج الدخول -->
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">كود الطالب</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="code" 
                                class="form-control" 
                                placeholder="أدخل الكود" 
                                maxlength="4"
                                inputmode="numeric"
                                required
                            >
                            <i class="fas fa-key input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control" 
                                placeholder="●●●●●●" 
                                maxlength="6"
                                inputmode="numeric"
                                required
                            >
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="auth-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        تسجيل الدخول
                    </button>
                </form>
                
                <!-- التذييل -->
                <div class="auth-footer">
                    <a href="../index.html">العودة للرئيسية</a>
                    <span>إنشاء وبرمجة أ/ اسماعيل عماد</span>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { login } from '../js/auth.js';
        import { validateCode, validatePassword } from '../js/utils.js';
        
        const loginForm = document.getElementById('loginForm');
        const codeInput = document.getElementById('code');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'flex';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = codeInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!validateCode(code)) {
                showError('الكود يجب أن يكون 4 أرقام');
                return;
            }
            
            if (!validatePassword(password)) {
                showError('كلمة المرور يجب أن تكون 6 أرقام');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
            
            try {
                const user = await login(code, password, 'student');
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        });
        
        codeInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
        });
        
        passwordInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
