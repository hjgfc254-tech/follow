<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>دخول الطلاب | مدرسة الجيل الجديد</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --navy-deep: #0A2647;
            --navy: #0F3460;
            --royal: #1E5FBB;
            --accent-red: #E63946;
            --white: #FFFFFF;
            --gold: #F59E0B;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            height: 100%;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
            background: linear-gradient(135deg, #0A2647 0%, #0F3460 30%, #1E5FBB 60%, #C92A2A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }
        
        /* جزيئات متحركة */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 25px 25px;
            animation: bgMove 50s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        /* هالة حمراء */
        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: rgba(230, 57, 70, 0.2);
            border-radius: 50%;
            filter: blur(80px);
            animation: redGlow 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes bgMove {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes redGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 36px;
            box-shadow: 
                0 30px 60px -15px rgba(10, 38, 71, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: auto;
        }
        
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9) rotate(-2deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        
        .top-bar {
            height: 6px;
            background: linear-gradient(90deg, #0A2647 0%, #1E5FBB 30%, #F59E0B 50%, #E63946 70%, #C92A2A 100%);
            background-size: 200% 100%;
            animation: barFlow 3s linear infinite;
        }
        
        @keyframes barFlow {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }
        
        .card-content {
            padding: 28px 24px 22px;
            text-align: center;
            position: relative;
        }
        
        /* ============ الشعار مع توهج ============ */
        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--white);
            box-shadow: 
                0 10px 30px rgba(10, 38, 71, 0.2),
                0 0 0 6px rgba(30, 95, 187, 0.1),
                0 0 40px rgba(30, 95, 187, 0.15);
            background: var(--white);
            animation: logoFloat 4s ease-in-out infinite;
            position: relative;
        }
        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .logo-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #1E5FBB;
            background: #EBF3FF;
        }
        
        /* ============ العنوان ============ */
        .login-title {
            font-size: 22px;
            font-weight: 900;
            color: #0A2647;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }
        
        .login-subtitle {
            font-size: 12px;
            color: #9CA3AF;
            margin-bottom: 20px;
        }
        
        /* ============ شارة "أمل نحو المستقبل" ============ */
        .slogan-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #E63946, #C92A2A);
            color: var(--white);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 18px;
            box-shadow: 0 6px 15px rgba(230, 57, 70, 0.3);
            animation: badgePulse 2.5s ease-in-out infinite;
        }
        
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .slogan-badge i {
            font-size: 10px;
            animation: sparkle 2s linear infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.3) rotate(180deg); }
        }
        
        /* ============ فاصل ============ */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #D1D5DB, transparent);
        }
        
        .divider-text {
            font-size: 11px;
            color: #9CA3AF;
            font-weight: 600;
        }
        
        /* ============ الحقول المبدعة ============ */
        .input-group {
            margin-bottom: 14px;
            text-align: right;
        }
        
        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #0A2647;
            margin-bottom: 6px;
        }
        
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrap .field-icon {
            position: absolute;
            right: 16px;
            color: #9CA3AF;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 1;
        }
        
        .form-input {
            width: 100%;
            padding: 13px 42px 13px 14px;
            border: 2px solid #E5E7EB;
            border-radius: 16px;
            font-family: 'Rubik', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #0A2647;
            background: #F8FAFC;
            transition: all 0.3s;
            letter-spacing: 5px;
            text-align: center;
            direction: ltr;
            position: relative;
        }
        
        .form-input:hover {
            border-color: #93C5FD;
            background: #F0F6FF;
        }
        
        .form-input:focus {
            border-color: #1E5FBB;
            background: var(--white);
            box-shadow: 
                0 0 0 4px rgba(30, 95, 187, 0.1),
                0 8px 20px rgba(30, 95, 187, 0.1);
            outline: none;
            transform: translateY(-1px);
        }
        
        .input-wrap:focus-within .field-icon {
            color: #1E5FBB;
            transform: scale(1.2);
        }
        
        .form-input::placeholder {
            letter-spacing: 1px;
            color: #D1D5DB;
            font-weight: 400;
            font-size: 13px;
        }
        
        /* ============ زر الدخول المبدع ============ */
        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #0A2647 0%, #1E5FBB 40%, #0F3460 70%, #0A2647 100%);
            background-size: 300% 300%;
            animation: gradientShift 5s ease infinite;
            color: var(--white);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 900;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 10px 25px rgba(30, 95, 187, 0.4),
                0 0 20px rgba(30, 95, 187, 0.2);
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shineSweep 3s ease-in-out infinite;
        }
        
        @keyframes shineSweep {
            0%, 60% { left: -100%; }
            100% { left: 100%; }
        }
        
        .login-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        
        .login-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 16px 35px rgba(30, 95, 187, 0.55),
                0 0 40px rgba(30, 95, 187, 0.35),
                0 0 60px rgba(230, 57, 70, 0.2);
            animation-play-state: paused;
        }
        
        .login-btn:active {
            transform: translateY(0) scale(0.96);
            box-shadow: 0 6px 15px rgba(30, 95, 187, 0.35);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            animation: none;
        }
        
        .login-btn i {
            font-size: 18px;
            position: relative;
            z-index: 1;
        }
        
        /* ============ رسالة الخطأ ============ */
        .error-box {
            display: none;
            background: linear-gradient(135deg, #FEF2F2, #FEE2E2);
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        
        /* ============ التذييل ============ */
        .footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed #D1D5DB;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #9CA3AF;
        }
        
        .footer a {
            color: #1E5FBB;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        
        .footer a:hover {
            color: #0A2647;
        }
        
        /* ============ الموبايل ============ */
        @media (max-width: 400px) {
            .card-content {
                padding: 22px 16px 18px;
            }
            
            .logo-wrapper {
                width: 75px;
                height: 75px;
            }
            
            .login-title {
                font-size: 19px;
            }
            
            .form-input {
                font-size: 16px;
                padding: 12px 38px 12px 12px;
            }
            
            .login-btn {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="top-bar"></div>
        
        <div class="card-content">
            <!-- الشعار -->
            <div class="logo-wrapper">
                <img src="../index.png" alt="شعار المدرسة" class="logo-img" id="logoImg" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
                <div id="logoFallback" class="logo-fallback" style="display: none;">
                    <i class="fas fa-graduation-cap"></i>
                </div>
            </div>
            
            <!-- العنوان -->
            <h1 class="login-title">دخول الطلاب</h1>
            <p class="login-subtitle">مدرسة الجيل الجديد</p>
            
            <!-- شارة -->
            <div class="slogan-badge">
                <i class="fas fa-star"></i>
                أمل نحو المستقبل
            </div>
            
            <!-- فاصل -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">تسجيل الدخول</span>
                <div class="divider-line"></div>
            </div>
            
            <!-- رسالة الخطأ -->
            <div class="error-box" id="errorBox">
                <span id="errorText"></span>
            </div>
            
            <!-- الحقول -->
            <div class="input-group">
                <label class="input-label">كود الطالب</label>
                <div class="input-wrap">
                    <i class="fas fa-user-graduate field-icon"></i>
                    <input type="text" id="code" class="form-input" placeholder="••••" maxlength="4" inputmode="numeric" required>
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">كلمة المرور</label>
                <div class="input-wrap">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••" maxlength="6" inputmode="numeric" required>
                </div>
            </div>
            
            <!-- زر الدخول -->
            <button class="login-btn" id="loginBtn" onclick="handleLogin()">
                <i class="fas fa-sign-in-alt"></i>
                <span>دخول</span>
            </button>
            
            <!-- التذييل -->
            <div class="footer">
                <a href="../index.html">العودة</a>
                <span>أ/ اسماعيل عماد</span>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { login } from '../js/auth.js';
        import { validateCode, validatePassword } from '../js/utils.js';
        
        const codeInput = document.getElementById('code');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        
        function showError(message) {
            errorText.textContent = message;
            errorBox.style.display = 'block';
            setTimeout(() => {
                errorBox.style.display = 'none';
            }, 4000);
        }
        
        window.handleLogin = async function() {
            const code = codeInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!validateCode(code)) {
                showError('الكود يجب أن يكون 4 أرقام');
                return;
            }
            
            if (!validatePassword(password)) {
                showError('كلمة المرور يجب أن تكون 6 أرقام');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الدخول...</span>';
            
            try {
                await login(code, password, 'student');
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>دخول</span>';
            }
        };
        
        codeInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
        });
        
        passwordInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
